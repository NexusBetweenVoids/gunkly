# TEST ONLY. Blueprint (authentik's declarative config) for the SSO CI test: an OAuth2/OIDC provider,
# the application that uses it, and two test users with their passwords. The passwords live here, not in
# setup.sh: the worker may (re)apply this blueprint at any time and would overwrite a password set by API.
version: 1
metadata:
  name: Gunkly CI test
entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: provider
    identifiers:
      name: gunkly-ci
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      grant_types: [authorization_code, refresh_token]
      client_id: gunkly-ci
      client_secret: ci-only-client-secret-not-a-real-secret
      redirect_uris:
        - matching_mode: strict
          url: http://localhost:4865/api/v1/auth/oidc/callback
      # Without a signing key authentik signs ID tokens with HS256, which Gunkly refuses.
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
  - model: authentik_core.application
    identifiers:
      slug: gunkly
    attrs:
      name: Gunkly (CI test)
      provider: !KeyOf provider
  - model: authentik_core.user
    identifiers:
      username: ci-sso-user
    attrs:
      name: Ci Sso
      email: ci-sso@example.test
      is_active: true
      password: ci-only-password-1
      path: users
  - model: authentik_core.user
    identifiers:
      username: ci-link-user
    attrs:
      name: Ci Link
      email: ci-link@example.test
      is_active: true
      password: ci-only-password-1
      path: users
