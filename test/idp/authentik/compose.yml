# TEST ONLY: authentik for the SSO CI test (see ../README.md). authentik 2025.10 and later needs no Redis.
x-authentik: &authentik
  image: ghcr.io/goauthentik/server:2026.8.6
  environment:
    AUTHENTIK_POSTGRESQL__HOST: postgresql
    AUTHENTIK_POSTGRESQL__NAME: authentik
    AUTHENTIK_POSTGRESQL__USER: authentik
    AUTHENTIK_POSTGRESQL__PASSWORD: ci-only-db
    AUTHENTIK_SECRET_KEY: ci-only-secret-key-not-a-real-secret-0123456789abcdef
    AUTHENTIK_BOOTSTRAP_PASSWORD: ci-only-admin
    AUTHENTIK_BOOTSTRAP_TOKEN: ci-only-api-token-not-a-real-secret
    AUTHENTIK_BOOTSTRAP_EMAIL: akadmin@example.test
    AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
    AUTHENTIK_DISABLE_UPDATE_CHECK: "true"
    AUTHENTIK_DISABLE_STARTUP_ANALYTICS: "true"
  depends_on:
    postgresql:
      condition: service_healthy
  volumes:
    - ./gunkly-ci.yaml:/blueprints/custom/gunkly-ci.yaml:ro

services:
  postgresql:
    image: postgres:16.9-alpine
    environment:
      POSTGRES_DB: authentik
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: ci-only-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d authentik -U authentik"]
      interval: 3s
      timeout: 5s
      retries: 20
  server:
    <<: *authentik
    command: server
    ports:
      - "9000:9000"
  worker:
    <<: *authentik
    command: worker
