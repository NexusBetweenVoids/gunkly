# Gunkly staging mirror: the release candidate on Postgres with every outbound
# channel captured (email -> Mailpit, webhooks -> the mock receiver). Synthetic
# data only; never point this at real users' data or real SMTP/webhook targets.
#
#   cp staging.env.example staging.env     # fill in the two secrets (staging only)
#   IMAGE_TAG=main docker compose -f compose.yml --env-file staging.env up -d
#   ../../scripts/seed-staging.sh http://127.0.0.1:8080
#
# Hosting specifics (domain, reverse proxy, firewall, secrets) live outside this repo.
name: gunkly-staging

services:
  gunkly:
    # Released tag, "main" CI build, or any image; set GUNKLY_IMAGE to override entirely.
    image: ${GUNKLY_IMAGE:-ghcr.io/nexusbetweenvoids/gunkly:${IMAGE_TAG:-latest}}
    restart: unless-stopped
    # Longer than GUNKLY_SHUTDOWN_TIMEOUT (30s) so SIGTERM can drain in-flight work.
    stop_grace_period: 40s
    environment:
      GUNKLY_DATABASE_URL: postgres://gunkly:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in staging.env}@postgres:5432/gunkly?sslmode=disable
      GUNKLY_SECRET_KEYS: ${GUNKLY_SECRET_KEYS:?set GUNKLY_SECRET_KEYS in staging.env}
      GUNKLY_BASE_URL: ${GUNKLY_BASE_URL:-http://127.0.0.1:8080}
      GUNKLY_TRUSTED_PROXIES: ${GUNKLY_TRUSTED_PROXIES:-}
      # Email goes to Mailpit, never to a real relay.
      GUNKLY_EMAIL_ENABLED: "true"
      GUNKLY_SMTP_HOST: mailpit
      GUNKLY_SMTP_PORT: "1025"
      GUNKLY_SMTP_TLS: none
      GUNKLY_SMTP_FROM: Gunkly Staging <staging@gunkly.invalid>
      GUNKLY_LOG_LEVEL: debug
      SQLITE_TMPDIR: /data/tmp
      # STAGING ONLY: Mailpit and the webhook receiver have private container
      # addresses, so the egress guard (ADR 0006) must be off here. scripts/seed-staging.sh
      # turns it off through the admin settings. Production keeps the guard ON.
    ports:
      - "${GUNKLY_PORT:-8080}:8080"
    volumes:
      - gunkly-data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71
    restart: unless-stopped
    environment:
      POSTGRES_USER: gunkly
      POSTGRES_DB: gunkly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in staging.env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gunkly -d gunkly"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  # SMTP capture: mail is accepted on 1025 and shown in the web UI, never delivered.
  mailpit:
    image: axllent/mailpit:v1.34.0@sha256:23a2ef85bc50853ab3093645d1d64679afd8887e89da5e48a88940c172591a4e
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    security_opt:
      - no-new-privileges:true

  # Webhook capture: any request is logged; GET /_requests lists the last 100.
  webhook:
    build: ./webhook
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEBHOOK_PORT:-8081}:8080"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

volumes:
  gunkly-data:
  postgres-data:
