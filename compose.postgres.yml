# Gunkly with Postgres. Usage:
#   cp .env.example .env   # set GUNKLY_SECRET_KEYS, GUNKLY_BASE_URL and POSTGRES_PASSWORD
#   docker compose -f compose.postgres.yml up -d
name: gunkly

services:
  gunkly:
    image: ghcr.io/nexusbetweenvoids/gunkly:latest
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      GUNKLY_DATABASE_URL: postgres://gunkly:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/gunkly?sslmode=disable
      SQLITE_TMPDIR: /data/tmp
    ports:
      - "8080:8080"
    volumes:
      - gunkly-data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71
    restart: unless-stopped
    environment:
      POSTGRES_USER: gunkly
      POSTGRES_DB: gunkly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/ by default.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gunkly -d gunkly"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    security_opt:
      - no-new-privileges:true

volumes:
  gunkly-data:
  postgres-data:
