name: Staging

# Deploys every green main build to the staging mirror (synthetic data, Mailpit,
# mock webhook receiver). A no-op with a notice until the maintainer configures
# the "staging" environment secrets; see docs/operations.md.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/nexusbetweenvoids/gunkly

jobs:
  image:
    name: Build image for main
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: echo "tag=main-${SHA:0:12}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          build-args: VERSION=${{ steps.tag.outputs.tag }}

  deploy:
    name: Deploy to staging
    needs: image
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
      BASE_URL: ${{ secrets.DEPLOY_BASE_URL }}
      CANARY_LOGIN: ${{ secrets.CANARY_LOGIN }}
      CANARY_PASSWORD: ${{ secrets.CANARY_PASSWORD }}
      CANARY_TOTP_SECRET: ${{ secrets.CANARY_TOTP_SECRET }}
    steps:
      - name: Check configuration
        id: cfg
        run: |
          missing=""
          for v in DEPLOY_SSH_KEY DEPLOY_HOST DEPLOY_KNOWN_HOSTS BASE_URL CANARY_LOGIN CANARY_PASSWORD; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::notice::Staging deploy skipped: secrets not configured in the staging environment (${missing# })."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.cfg.outputs.ready == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Configure SSH
        if: steps.cfg.outputs.ready == 'true'
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          echo "DEPLOY_SSH_OPTS=-i $HOME/.ssh/deploy_key -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=yes" >> "$GITHUB_ENV"
      - name: Ship the staging compose files
        if: steps.cfg.outputs.ready == 'true'
        run: |
          # shellcheck disable=SC2086
          scp $DEPLOY_SSH_OPTS -r deploy/staging/. "$DEPLOY_HOST:${DEPLOY_DIR:-.}/"
      - name: Deploy and canary
        if: steps.cfg.outputs.ready == 'true'
        env:
          IMAGE_TAG: ${{ needs.image.outputs.tag }}
          COMPOSE_FILE: compose.yml
          COMPOSE_ENV_FILE: staging.env
          DB_KIND: postgres
        run: scripts/deploy.sh
