name: Fuzz

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with `grep -rn 'func Fuzz'` (scripts/fuzz-targets.sh checks this).
        # Add every Fuzz* target that parses user input (imports, notification URLs, ...).
        include:
          - pkg: ./internal/schedule
            target: FuzzParseRRule
          - pkg: ./internal/notify
            target: FuzzValidateURL
          - pkg: ./internal/ical
            target: FuzzEscapeFold
          - pkg: ./internal/schedule
            target: FuzzLocalTime
          - pkg: ./internal/egress
            target: FuzzBlocked
          - pkg: ./internal/egress
            target: FuzzWebPushAllowed
          - pkg: ./internal/transfer
            target: FuzzImport
          - pkg: ./internal/api
            target: FuzzForwarded
          - pkg: ./internal/api
            target: FuzzValidRedirectURI
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: go test -fuzz
        run: go test ${{ matrix.pkg }} -run='^$' -fuzz='^${{ matrix.target }}$' -fuzztime=2m
      - name: Upload failing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-${{ matrix.target }}
          path: '**/testdata/fuzz/${{ matrix.target }}/**'
