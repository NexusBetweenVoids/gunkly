name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: Go (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: make fmt
      - name: go vet
        run: make vet
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          # Build with the go.mod toolchain so linting Go 1.27 code works.
          install-mode: goinstall
      - name: deadcode
        run: make deadcode
      - name: Dependency budget
        run: make dep-budget
      - name: Fuzz matrix covers every Fuzz target
        run: make fuzz-check
      - name: go test -race (SQLite)
        run: make test
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

  go-postgres:
    name: Go (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: gunkly
          POSTGRES_PASSWORD: gunkly
          POSTGRES_DB: gunkly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gunkly -d gunkly_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GUNKLY_TEST_POSTGRES_URL: postgres://gunkly:gunkly@localhost:5432/gunkly_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: go test -race (Postgres)
        run: make test-pg

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run build
      - run: npm run budget
      - name: Frontend fitness checks
        working-directory: .
        run: make fitness

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # `npm run e2e` builds the web bundle and the Go binary itself.
      - run: npm run e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            web/e2e/.out/
          if-no-files-found: ignore
          retention-days: 7

  openapi:
    name: OpenAPI breaking changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      OASDIFF_VERSION: '1.39.0'
      OASDIFF_SHA256: 71a85930728f367a2086077b7ae1411319421549d18473a3e8258b6451520433 # oasdiff_1.39.0_linux_amd64.tar.gz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The checked-out ref is the PR merge commit; its first parent is the base tip.
          fetch-depth: 2
          persist-credentials: false
      - name: Install oasdiff (checksum verified)
        run: |
          f="oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$f" "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/$f"
          echo "$OASDIFF_SHA256  $RUNNER_TEMP/$f" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/oasdiff"
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP/oasdiff" oasdiff
          echo "$RUNNER_TEMP/oasdiff" >> "$GITHUB_PATH"
      - name: Fail on breaking /api/v1 changes
        run: make openapi-diff BASE=HEAD^1

  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Large commits make `git log -p` warn about rename detection on stderr,
      # which gitleaks treats as a scan failure.
      - run: git config --global diff.renameLimit 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Organisation-owned repos also need GITLEAKS_LICENSE; personal repos do not.
          GITLEAKS_ENABLE_COMMENTS: false

  licenses:
    name: License compatibility (AGPL-3.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # paho.golang (MQTT, via Shoutrrr) is dual EPL-2.0 / EDL-1.0; Gunkly uses
      # it under EDL-1.0 (BSD-3-Clause), which go-licenses cannot detect.
      - name: go-licenses check
        run: >-
          go run github.com/google/go-licenses/v2@v2.0.1 check ./...
          --ignore github.com/NexusBetweenVoids/gunkly
          --ignore github.com/eclipse/paho.golang
          --allowed_licenses=MIT,BSD-2-Clause,BSD-3-Clause,Apache-2.0,ISC,MPL-2.0,AGPL-3.0,LGPL-2.1,LGPL-3.0
      - name: npm licenses
        working-directory: web
        run: npm run licenses

  docker:
    name: Container image
    runs-on: ubuntu-latest
    needs: [go, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (linux/amd64, no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: gunkly:ci
          build-args: VERSION=${{ github.sha }}
      - name: Image size budget (40 MB) and binary size
        env:
          MAX_IMAGE_BYTES: '40000000'
        run: |
          size=$(docker image inspect gunkly:ci --format '{{.Size}}')
          id=$(docker create gunkly:ci)
          docker cp "$id:/gunkly" "$RUNNER_TEMP/gunkly"
          docker rm "$id" >/dev/null
          echo "image: $size bytes (budget $MAX_IMAGE_BYTES)"
          echo "binary: $(stat -c %s "$RUNNER_TEMP/gunkly") bytes"
          if [ "$size" -gt "$MAX_IMAGE_BYTES" ]; then
            echo "::error::image exceeds the 40 MB budget"
            exit 1
          fi
      - name: Boot and probe /healthz
        run: |
          key="1:$(openssl rand -base64 32)"
          docker volume create gunkly-ci
          docker run -d --name gunkly --read-only --cap-drop ALL --security-opt no-new-privileges \
            -p 4865:4865 -v gunkly-ci:/data \
            -e GUNKLY_SECRET_KEYS="$key" -e GUNKLY_BASE_URL=http://localhost:4865 gunkly:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:4865/healthz && exit 0
            sleep 1
          done
          docker logs gunkly
          exit 1
      - name: Logs
        if: always()
        run: docker logs gunkly || true

  upgrade:
    name: Upgrade from latest release
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Find the latest release
        id: prev
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag=$(gh release list --exclude-pre-releases --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName // ""')
          if [ -z "$tag" ]; then
            echo "::notice::No release exists yet; upgrade test skipped."
          else
            echo "latest release: $tag"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.prev.outputs.tag != ''
      - name: Build candidate image
        if: steps.prev.outputs.tag != ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: gunkly:upgrade
          build-args: VERSION=${{ github.sha }}
      - name: Upgrade test (previous release -> this PR)
        if: steps.prev.outputs.tag != ''
        env:
          PREV_TAG: ${{ steps.prev.outputs.tag }}
        run: scripts/upgrade-test.sh "$PREV_TAG" gunkly:upgrade
