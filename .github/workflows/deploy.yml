name: Deploy production

# Tag-driven production rollout. Runs after the Release workflow (which builds,
# signs and publishes the image) succeeds for a vX.Y.Z tag, or manually with a
# tag to redeploy or roll back. The "production" environment must have required
# reviewers; the job waits for approval. A no-op with a notice when secrets are
# absent. See docs/operations.md.
#
# Note: the release is created with GITHUB_TOKEN, which does not trigger
# `release: published` workflows, hence workflow_run on the Release workflow.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to deploy (vX.Y.Z)
        required: true
        type: string

permissions: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/nexusbetweenvoids/gunkly

jobs:
  deploy:
    name: Deploy to production
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
      BASE_URL: ${{ secrets.DEPLOY_BASE_URL }}
      CANARY_LOGIN: ${{ secrets.CANARY_LOGIN }}
      CANARY_PASSWORD: ${{ secrets.CANARY_PASSWORD }}
      CANARY_TOTP_SECRET: ${{ secrets.CANARY_TOTP_SECRET }}
      RAW_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.workflow_run.head_branch }}
    steps:
      - name: Resolve release tag
        id: rel
        run: |
          if ! [[ "$RAW_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::notice::'$RAW_TAG' is not a vX.Y.Z release tag; nothing to deploy."
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "tag=$RAW_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${RAW_TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Check configuration
        id: cfg
        if: steps.rel.outputs.tag != ''
        run: |
          missing=""
          for v in DEPLOY_SSH_KEY DEPLOY_HOST DEPLOY_KNOWN_HOSTS BASE_URL CANARY_LOGIN CANARY_PASSWORD; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::notice::Production deploy skipped: secrets not configured in the production environment (${missing# })."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.cfg.outputs.ready == 'true'
        with:
          ref: ${{ steps.rel.outputs.tag }}
          persist-credentials: false
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: steps.cfg.outputs.ready == 'true'
      - name: Verify the image signature
        if: steps.cfg.outputs.ready == 'true'
        env:
          VERSION: ${{ steps.rel.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          cosign verify "${IMAGE}:${VERSION}" \
            --certificate-identity-regexp "^https://github.com/${REPO}/\.github/workflows/release\.yml@refs/tags/v" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null
      - name: Configure SSH
        if: steps.cfg.outputs.ready == 'true'
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          echo "DEPLOY_SSH_OPTS=-i $HOME/.ssh/deploy_key -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=yes" >> "$GITHUB_ENV"
      - name: Deploy, canary and auto-rollback
        if: steps.cfg.outputs.ready == 'true'
        env:
          IMAGE_TAG: ${{ steps.rel.outputs.version }}
          # Compose file and env file live on the host (hosting config is not in this repo).
          COMPOSE_FILE: ${{ vars.COMPOSE_FILE || 'compose.yml' }}
          COMPOSE_ENV_FILE: ${{ vars.COMPOSE_ENV_FILE }}
          DB_KIND: ${{ vars.DB_KIND || 'sqlite' }}
        run: scripts/deploy.sh
