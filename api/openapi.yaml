    post:
      tags: [push]
      summary: Register this browser for Web Push reminders
      description: |
        Body is the browser's PushSubscription.toJSON() (endpoint and keys). The endpoint must be a known push
        service (fcm.googleapis.com, web.push.apple.com, updates.push.services.mozilla.com, *.notify.windows.com;
