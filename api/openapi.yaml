        "404": {$ref: "#/components/responses/NotFound"}
  /households/{hh}/calendar:
    parameters: [{$ref: "#/components/parameters/hh"}]
    get:
      security: [{cookieAuth: []}, {bearerAuth: [chores:read]}]
      tags: [chores]
