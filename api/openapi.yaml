openapi: 3.0.3
info:
  title: Gunkly API
  version: 1.0.0
  description: |
    The versioned JSON API under /api/v1. Browser sessions use the gunkly_session
    cookie; state-changing requests also send the gunkly_csrf cookie value in the
    X-CSRF-Token header. Errors are {"error":{"code":"..."}} with stable codes;
    the server never sends user-facing text. Household routes answer 404 to
    non-members (no existence oracle) and 403 when the role is too low
    (guest < member < owner). Breaking changes to /api/v1 are forbidden.

    Integrations (Home Assistant, MCP servers, scripts) authenticate with an API
    token: `Authorization: Bearer gk_...`, created under Account > Integrations.
    Operations that list `bearerAuth` accept a token carrying the named scope;
    every other operation refuses tokens (403 token_not_allowed). A bearer
    request ignores cookies and needs no CSRF header. A token is bound to
    households and acts with its owner's current role there: an unbound
    household answers 404, a missing scope 403 insufficient_scope, and a missing,
    unknown, expired or revoked token 401 with `WWW-Authenticate: Bearer`.
    Tokens are limited to 120 requests/minute (burst 60).
servers:
  - url: /api/v1
tags:
  - {name: setup}
  - {name: session}
  - {name: account}
  - {name: households}
  - {name: areas}
  - {name: chores}
  - {name: reminders}
  - {name: feeds}
  - {name: channels}
  - {name: push}
  - {name: webhooks}
  - {name: tokens}
  - {name: admin}
paths:
  /setup:
    get:
      tags: [setup]
      summary: Whether first-run setup is pending
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: object, properties: {needed: {type: boolean}}}}}}
    post:
      tags: [setup]
      summary: Create the first admin with the one-time setup code from the server log
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/SetupRequest"}}}}
      responses:
        "201": {description: Admin created and signed in, content: {application/json: {schema: {$ref: "#/components/schemas/Session"}}}}
        "400": {$ref: "#/components/responses/Invalid"}
        "403": {description: Invalid setup code (invalid_setup_code)}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/RateLimited"}
  /session:
    get:
      tags: [session]
      summary: Current session; also issues the CSRF cookie
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Session"}}}}
    post:
      tags: [session]
      summary: Sign in (password, plus TOTP or a recovery code when 2FA is on)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, password]
              properties:
                login: {type: string, description: Username or email}
                password: {type: string}
                totp: {type: string}
                emailCode: {type: string, description: "Code emailed to the user (second factor: email)"}
                recoveryCode: {type: string}
                passkey: {$ref: "#/components/schemas/PasskeyAnswer"}
                sendEmailCode: {type: boolean, description: "Second step of an account with email codes and a passkey: send the emailed code now (it is not sent automatically while a passkey is offered)"}
      responses:
        "200": {description: "Signed in, or twoFactorRequired with method totp, email or passkey (for email the code is sent by this call and emailSent is true; repeat it without a code to resend; when a passkey is offered too, the code is only sent with sendEmailCode)", content: {application/json: {schema: {$ref: "#/components/schemas/Session"}}}}
        "401": {description: invalid_credentials or invalid_code}
        "429": {$ref: "#/components/responses/RateLimited"}
    delete:
      tags: [session]
      summary: Sign out
      responses:
        "204": {description: Signed out}
        "401": {$ref: "#/components/responses/Unauthenticated"}
  /session/step-up:
    post:
      tags: [session]
      summary: Re-verify credentials for sensitive actions (valid 15 minutes)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password: {type: string}
                totp: {type: string}
                recoveryCode: {type: string}
                emailCode: {type: string}
                passkey: {$ref: "#/components/schemas/PasskeyAnswer"}
      description: Password plus second factor, or a passkey alone (without `password`; the options come from `/session/step-up/passkey/options`).
      responses:
        "204": {description: Verified}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "429": {$ref: "#/components/responses/RateLimited"}
  /session/passkey/login/options:
    post:
      tags: [session]
      summary: Options for a passwordless sign-in with a passkey (discoverable credential)
      description: 404 unless the instance has an https (or localhost) `GUNKLY_BASE_URL`. User verification is required. Pass the result to `navigator.credentials.get`, then send the credential to `/session/passkey/login`.
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/PasskeyOptions"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/RateLimited"}
  /session/passkey/login:
    post:
      tags: [session]
      summary: Sign in with a passkey (counts as password plus second factor)
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/PasskeyAnswer"}}}
      responses:
        "200": {description: Signed in, content: {application/json: {schema: {$ref: "#/components/schemas/Session"}}}}
        "401": {description: "The passkey was not accepted (unknown, wrong, expired challenge or a signature counter that did not increase)", content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/RateLimited"}
  /session/passkey/options:
    post:
      tags: [session]
      summary: Options for a passkey as the second factor after a password
      description: Takes the same `login` and `password` as `POST /session` and verifies them first. 404 when the account has no passkey. The assertion goes in `passkey` of `POST /session`.
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [login, password], properties: {login: {type: string}, password: {type: string}}}}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/PasskeyOptions"}}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/RateLimited"}
  /session/step-up/passkey/options:
    post:
      tags: [session]
      summary: Options to re-verify a signed-in user with a passkey (user verification required)
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/PasskeyOptions"}}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/RateLimited"}
  /account/passkeys:
    get:
      tags: [account]
      summary: The caller's passkeys (names and dates only; session only)
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Passkey"}}}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
    post:
      tags: [account]
      summary: Finish registering a passkey (session only; needs step-up)
      description: The first second factor of an account also returns `recoveryCodes`, shown once. Other sessions of the account are signed out.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge, credential, name]
              properties:
                challenge: {type: string}
                credential: {type: object, description: "The PublicKeyCredential from navigator.credentials.create in JSON form (binary values base64url)"}
                name: {type: string, maxLength: 100}
      responses:
        "201": {description: Created, content: {application/json: {schema: {type: object, properties: {passkey: {$ref: "#/components/schemas/Passkey"}, recoveryCodes: {type: array, items: {type: string}}}}}}}
        "400": {description: "`passkey_failed` (the browser's answer did not verify), `passkeys_require_https` or invalid", content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {description: "`passkey_exists` or limit reached", content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /account/passkeys/options:
    post:
      tags: [account]
      summary: Start registering a passkey (session only; needs step-up)
      description: Returns creation options for `navigator.credentials.create` (attestation none, discoverable credential, user verification required). 400 `passkeys_require_https` without an https (or localhost) `GUNKLY_BASE_URL`.
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/PasskeyOptions"}}}}
        "400": {$ref: "#/components/responses/Invalid"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/LimitReached"}
  /account/passkeys/{id}:
    parameters: [{$ref: "#/components/parameters/id"}]
    delete:
      tags: [account]
      summary: Remove a passkey (session only; needs step-up)
      description: Signs out the account's other sessions and revokes its API tokens, like removing another second factor. Hosted mode refuses to remove the last second factor (`two_factor_mandatory`).
      responses:
        "204": {description: Removed}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {description: two_factor_mandatory, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /session/step-up/sso:
    post:
      tags: [session]
      summary: Start a step-up through the single sign-on provider (session only)
      description: 404 unless single sign-on is configured and the account is linked. The provider is asked to authenticate the user again; the browser goes to the returned `url` and comes back to the page in `next` with `?sso=stepup`.
      requestBody:
        content: {application/json: {schema: {type: object, properties: {next: {type: string, description: "A path on this site to return to"}}}}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: object, properties: {url: {type: string}}}}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404": {$ref: "#/components/responses/NotFound"}
        "502": {description: The provider could not be reached, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /auth/oidc/start:
    get:
      tags: [session]
      summary: Begin signing in with the single sign-on provider (a browser navigation)
      description: Answers 303 to the provider's authorization endpoint (authorization code flow with PKCE S256, state and nonce) and sets a short-lived sealed cookie. 404 unless `GUNKLY_OIDC_*` is configured (never in hosted mode). `next` is a path on this site to land on after signing in.
      parameters:
        - {name: next, in: query, schema: {type: string}}
      responses:
        "303": {description: "To the provider, or to /signin?sso=unavailable"}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/RateLimited"}
  /auth/oidc/callback:
    get:
      tags: [session]
      summary: Where the provider sends the browser back (redirect URI)
      description: "Checks state, redeems the code, verifies the ID token and then signs in, links the identity or confirms a step-up, depending on how the flow started. It always answers 303 to the app: on success to the page the flow was for, otherwise to `/signin?sso=<code>` or `/account/security?sso=<code>` with `failed`, `denied`, `unavailable`, `no_account` (an unknown identity while account creation is off) or `already_linked`. A sign-in counts as fully authenticated: the provider handles multi-factor."
      responses:
        "303": {description: Back to the app}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/RateLimited"}
  /account/sso:
    get:
      tags: [account]
      summary: Whether the account is linked to the single sign-on provider (session only)
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: object, properties: {name: {type: string}, linked: {type: boolean}, linkedAt: {type: string, format: date-time, nullable: true}, canUnlink: {type: boolean, description: "The account has a password or a passkey to sign in with instead"}}}}}}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      tags: [account]
      summary: Unlink the single sign-on identity (session only; needs step-up)
      description: Refused (`409 sso_last_login`) when the account has neither a password nor a passkey. Signs out the other sessions and revokes API tokens.
      responses:
        "204": {description: Unlinked}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {description: sso_last_login, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /account/sso/link:
    post:
      tags: [account]
      summary: Start linking the account to the single sign-on provider (session only; needs step-up)
      description: Returns the provider's URL for the browser to go to; the callback links the identity and signs out the other sessions. Never links by email. 409 `sso_already_linked`.
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: object, properties: {url: {type: string}}}}}}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {description: sso_already_linked, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "502": {description: The provider could not be reached, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /sessions:
    get:
      tags: [session]
      summary: Signed-in devices
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Device"}}}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
    delete:
      tags: [session]
      summary: Sign out every other device
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: object, properties: {revoked: {type: integer}}}}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
  /sessions/{id}:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}]
    delete:
      tags: [session]
      summary: Sign out one device
      responses:
        "204": {description: Revoked}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404": {$ref: "#/components/responses/NotFound"}
  /me:
    get:
      tags: [account]
      summary: The signed-in user
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Me"}}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
    patch:
      tags: [account]
      summary: Update profile (display name, language, first weekday)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName: {type: string}
                locale: {type: string, description: "BCP 47 tag; empty follows the browser"}
                weekStart: {type: integer, nullable: true, minimum: 0, maximum: 6, description: "0 = Sunday; null = language default"}
                signinAlerts: {type: boolean, description: "Email about a sign-in from an unusual place (new country or hosting network); default true. Only has an effect while the instance has a location source (instance.signinAlerts)."}
                emailReminders: {type: boolean, description: "Send reminders by email; needs email on the instance and a verified address (else 400). Cleared when the address changes."}
                quietHours: {type: object, nullable: true, properties: {start: {type: integer, minimum: 0, maximum: 1439}, end: {type: integer, minimum: 0, maximum: 1439}}, description: "Personal quiet hours, minutes after local midnight in timeZone (or in the household's time zone when timeZone is null); wraps midnight when start > end; start == end is invalid; null clears. Applies to the user's own routes (Web Push, email, personal channels), never household channels. Session only."}
                timeZone: {type: string, nullable: true, description: "IANA time zone name (for example Europe/Amsterdam) that the personal quiet hours are read in; null or empty follows each household's time zone (the default). Unknown names are 400. Due dates and reminder times are not affected. Session only."}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Me"}}}}
        "400": {$ref: "#/components/responses/Invalid"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
  /account/password:
    post:
      tags: [account]
      summary: Change password (step-up required)
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [newPassword], properties: {newPassword: {type: string}}}}}}
      responses:
        "204": {description: Changed; other sessions are signed out}
        "400": {$ref: "#/components/responses/Invalid"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/RateLimited"}
  /account/totp/setup:
    post:
      tags: [account]
      summary: Start TOTP enrolment (step-up required)
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: object, properties: {secret: {type: string}, uri: {type: string}}}}}}
        "403": {$ref: "#/components/responses/Forbidden"}
  /account/totp/confirm:
    post:
      tags: [account]
      summary: Confirm TOTP enrolment with a code; returns recovery codes once
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [code], properties: {code: {type: string}}}}}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: object, properties: {recoveryCodes: {type: array, items: {type: string}}}}}}}
        "400": {$ref: "#/components/responses/Invalid"}
        "401": {description: invalid_code}
        "429": {$ref: "#/components/responses/RateLimited"}
  /account/totp:
    delete:
      tags: [account]
      summary: Disable TOTP (step-up required); refused in hosted mode (two_factor_mandatory)
      responses:
        "204": {description: Disabled}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {description: two_factor_mandatory}
  /account/recovery-codes:
    get:
      tags: [account]
      summary: How many unused recovery codes are left (the codes are only shown when created)
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: object, properties: {remaining: {type: integer}, available: {type: boolean, description: "The account has a second factor, so recovery codes can be created"}}}}}}
    post:
      tags: [account]
      summary: Replace all recovery codes with a new set (step-up required); returns them once
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: object, properties: {recoveryCodes: {type: array, items: {type: string}}}}}}}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {description: no_second_factor}
  /account/email-otp:
    post:
      tags: [account]
      summary: Use emailed codes as the second factor instead of TOTP (step-up required, verified email needed); returns new recovery codes once
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: object, properties: {recoveryCodes: {type: array, items: {type: string}}}}}}}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {description: email_not_verified or email_otp_already_enabled}
        "429": {$ref: "#/components/responses/RateLimited"}
    delete:
      tags: [account]
      summary: Turn emailed codes off (step-up required); refused in hosted mode (two_factor_mandatory)
      responses:
        "204": {description: Disabled}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {description: two_factor_mandatory}
  /account/email/verify:
    post:
      tags: [account]
      summary: Confirm an email address with the token from the emailed link (single use, valid 24 hours). In hosted mode a user without a second factor is enrolled in emailed codes and receives recovery codes once
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [token], properties: {token: {type: string}, signIn: {type: boolean, description: "Also sign in on this device, once: only for the first confirmation of an account created in the last 24 hours, not an email change, and only without a session (see /account/email/verify/preview)"}}}}}}
      responses:
        "200": {description: "Verified; with signIn (when allowed) also the new session (cookies set)", content: {application/json: {schema: {type: object, properties: {verified: {type: boolean}, recoveryCodes: {type: array, items: {type: string}}, session: {$ref: "#/components/schemas/Session"}}}}}}
        "400": {description: "invalid_token (unknown, used or expired)", content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {description: email_unavailable}
        "429": {$ref: "#/components/responses/RateLimited"}
  /account/email/verify/preview:
    post:
      tags: [account]
      summary: "Look the confirmation token up without using it: continueAs (the display name) is present when confirming may also sign in on this device (signIn on /account/email/verify)"
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [token], properties: {token: {type: string}}}}}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: object, properties: {continueAs: {type: string}}}}}}
        "400": {description: "invalid_token (unknown, used or expired)", content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/RateLimited"}
  /account/email/resend:
    post:
      tags: [account]
      summary: Send the verification link again (to the pending new address, or the current unverified one)
      responses:
        "202": {description: Queued}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {description: already_verified}
        "429": {$ref: "#/components/responses/RateLimited"}
  /account/email:
    patch:
      tags: [account]
      summary: Change the email address (step-up required). A verification link goes to the new address and the old one is notified; the address changes when the link is opened. Answers 202 even if the address belongs to another account
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [email], properties: {email: {type: string}}}}}}
      responses:
        "202": {description: Queued}
        "400": {$ref: "#/components/responses/Invalid"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/RateLimited"}
  /password-reset/request:
    post:
      tags: [session]
      summary: Email a password reset link (valid 1 hour). Always answers 202, whether or not the account exists
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [login], properties: {login: {type: string, description: Username or email}}}}}}
      responses:
        "202": {description: Accepted}
        "400": {$ref: "#/components/responses/Invalid"}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/RateLimited"}
  /password-reset/confirm:
    post:
      tags: [session]
      summary: Set a new password with a reset token (single use). Signs the account out everywhere
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [token, password], properties: {token: {type: string}, password: {type: string}}}}}}
      responses:
        "204": {description: Password changed}
        "400": {description: invalid_token or a password error, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/RateLimited"}
  /instance:
    get:
      tags: [setup]
      summary: What this instance offers (public)
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: object, properties: {minPasswordLength: {type: integer, description: "Shortest password the admin allows (new accounts, resets and changes)"}, openSignup: {type: boolean}, emailEnabled: {type: boolean}, hostedMode: {type: boolean}, requirePow: {type: boolean, description: "Sign-up needs a proof of work"}, baseUrl: {type: string, description: "Configured public address (GUNKLY_BASE_URL), empty when not set"}, mcpEnabled: {type: boolean, description: "The MCP endpoint /mcp is served"}, sso: {type: object, properties: {name: {type: string, description: "Button label from GUNKLY_OIDC_NAME; may be empty"}}, description: "Present only while single sign-on is configured (self-hosted)"}, passkeysAvailable: {type: boolean, description: "GUNKLY_BASE_URL is https (or localhost), so passkeys can be registered and used"}, oauthEnabled: {type: boolean, description: "Present (true) only while OAuth sign-in for MCP clients is on; absent otherwise"}, webhooksEnabled: {type: boolean, description: "Present (true) only while outgoing webhooks are on; absent otherwise"}, signinAlerts: {type: boolean, description: "Present (true) only while the instance can tell where a sign-in came from (a trusted-proxy country header or GeoIP database), so unusual sign-in emails are possible; absent otherwise"}, aiEnabled: {type: boolean, description: "Present (true) only while AI chore suggestions are configured and on; absent otherwise"}, privacyUrl: {type: string, description: "Hosted service only (GUNKLY_PRIVACY_URL): link to its privacy policy; absent otherwise"}, termsUrl: {type: string, description: "Hosted service only (GUNKLY_TERMS_URL): link to its terms of use; absent otherwise"}}}}}}
  /signup/challenge:
    get:
      tags: [setup]
      summary: A proof-of-work challenge for sign-up (ALTCHA-compatible, SHA-256; valid 10 minutes, single use)
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/PoWChallenge"}}}}
        "404": {description: Sign-up is closed or needs no proof of work, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "429": {$ref: "#/components/responses/RateLimited"}
  /signup:
    post:
      tags: [setup]
      summary: "Create an account without an invite (only when open sign-up is on). Self-hosted (hostedMode false): the email is optional, even with SMTP; the account is created and signed in (201), a verification mail is sent if an address is given and SMTP is configured, and a taken email or username answers registration_failed. Hosted mode: the email is required and the answer is 202 (nobody is signed in, the address is verified by link) whether or not the address already had an account"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/NewAccount"
                - type: object
                  properties:
                    locale: {type: string}
                    pow: {$ref: "#/components/schemas/PoWSolution"}
      responses:
        "201": {description: Account created and signed in (self-hosted), content: {application/json: {schema: {$ref: "#/components/schemas/Session"}}}}
        "202": {description: Hosted mode - check your email. Same answer for a new and an already registered address, content: {application/json: {schema: {type: object, properties: {accepted: {type: boolean}}}}}}
        "400": {description: "Invalid input, pow_invalid (bad, expired or reused solution; the solution is spent as soon as it is checked) or registration_failed (username or, self-hosted, email taken)", content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "403": {description: registration_disabled}
        "429": {$ref: "#/components/responses/RateLimited"}
  /token:
    get:
      tags: [tokens]
      summary: Describe the calling API token (bearer only)
      description: Any valid token may call this, whatever its scopes. Households lists only those the token is bound to and its owner still belongs to, with the owner's current role.
      security: [{bearerAuth: []}]
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/TokenSelf"}}}}
        "401": {$ref: "#/components/responses/UnauthenticatedBearer"}
        "429": {$ref: "#/components/responses/RateLimited"}
  /account/tokens:
    get:
      tags: [tokens]
      summary: The caller's active API tokens (session only; never the secrets)
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Token"}}}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
    post:
      tags: [tokens]
      summary: Create an API token (session only; needs step-up)
      description: The secret is in the response once, as `token`, and cannot be shown again. Scopes do not imply one another. Whatever the scopes, a token acts with the owner's current role in each bound household (a guest owner can only read).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scopes, households]
              properties:
                name: {type: string, maxLength: 100}
                scopes: {type: array, minItems: 1, items: {type: string, enum: ["chores:read", "chores:complete", "chores:write"]}}
                households: {type: array, minItems: 1, maxItems: 50, items: {type: string}, description: Household IDs the caller belongs to}
                expiresInDays: {type: integer, nullable: true, minimum: 1, maximum: 3650, description: Omit or null for a token that never expires}
      responses:
        "201": {description: Created, content: {application/json: {schema: {$ref: "#/components/schemas/Token"}}}}
        "400": {$ref: "#/components/responses/Invalid"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/LimitReached"}
  /account/tokens/{id}:
    parameters: [{$ref: "#/components/parameters/id"}]
    delete:
      tags: [tokens]
      summary: Revoke an API token; it stops working at once
      responses:
        "204": {description: Revoked}
        "404": {$ref: "#/components/responses/NotFound"}
  /account/oauth-grants:
    get:
      tags: [tokens]
      summary: Apps connected through OAuth ("Connected apps"; session only)
      description: The caller's active grants (ADR 0016), newest first; never any secret. Empty while nothing is connected.
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/OAuthGrant"}}}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
  /account/oauth-grants/{id}:
    parameters: [{$ref: "#/components/parameters/id"}]
    delete:
      tags: [tokens]
      summary: Disconnect an app; its tokens stop working at once
      responses:
        "204": {description: Disconnected}
        "404": {$ref: "#/components/responses/NotFound"}
  /account/audit:
    get:
      tags: [account]
      summary: The user's own recent audit events
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/AuditEvent"}}}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
  /account/deletion-preview:
    get:
      tags: [account]
      summary: What deleting the account would do
      description: |
        deleteHouseholds are the households deleted with the account (no non-guest member would remain);
        needOwner are those where the caller is the last owner and others remain: the caller must name a new
        owner (a non-guest member, never a guest) for each when deleting.
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/DeletionPreview"}}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
  /account:
    delete:
      tags: [account]
      summary: Delete the account permanently (step-up required)
      description: |
        One transaction: ownership passes to the chosen members, households without a non-guest member are
        deleted, chores assigned only to the caller become unassigned, completions are anonymised ("Deleted user"),
        sessions, tokens, notification channels, push subscriptions and feeds are removed and audit rows lose their
        actor, IP and metadata. Cannot be undone. 409 owner_required lists the households still needing a new
        owner (field households); 409 last_admin when the caller is the only instance admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmUsername]
              properties:
                confirmUsername: {type: string, description: "The caller's own username, case-insensitive; the explicit confirmation"}
                newOwners: {type: object, additionalProperties: {type: string}, description: "Household id to the user id of its new owner"}
      responses:
        "204": {description: Deleted; the session cookies are cleared}
        "400": {description: "invalid, confirmation_mismatch"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {description: "owner_required (with households: the same shape as needOwner) or last_admin", content: {application/json: {schema: {$ref: "#/components/schemas/OwnerRequired"}}}}
  /account/export:
    get:
      tags: [account]
      summary: Export all of the user's own data as a JSON download (step-up)
      description: |
        Format gunkly-user-export, version 1: profile, preferences, memberships (household names and roles), the user's own
        completions, personal notification channels (kind and label only, never URLs), sessions (device labels, no tokens),
        own audit events. Sent as an attachment. Audited. Rate limit 6/min per IP.
      responses:
        "200": {description: The export file, headers: {Content-Disposition: {schema: {type: string}, description: attachment}}, content: {application/json: {schema: {$ref: "#/components/schemas/UserExport"}}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/RateLimited"}
  /households/{hh}/export:
    parameters: [{$ref: "#/components/parameters/hh"}]
    get:
      tags: [households]
      summary: Export the household as a JSON download (member; guests are refused)
      description: |
        Format gunkly-household-export, version 1: settings, areas, chores (schedule, reminders, pause and archive state,
        assignee display names and usernames as hints) and completion history. Never includes notification channels, feeds,
        tokens, invites or member emails. An owner's export also carries the household's webhooks (name, events, URL, enabled flag,
        never the signing secret). Webhook URLs can embed credentials, so treat the file as sensitive. A member's export has no
        webhooks. Audited. Rate limit 6/min per IP.
      responses:
        "200": {description: The export file, headers: {Content-Disposition: {schema: {type: string}, description: attachment}}, content: {application/json: {schema: {$ref: "#/components/schemas/HouseholdExport"}}}}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/RateLimited"}
  /households/import:
    post:
      tags: [households]
      summary: Create a household from an export file (the user becomes owner)
      description: |
        The body is a gunkly-household-export file (up to 5 MiB; every other route accepts 1 MiB). The whole file is
        validated like the normal create paths and applied in one transaction. Webhooks in the file are re-created disabled with
        new signing secrets (see ImportSummary.webhooksSkipped for the ones that were not). Rate limit 6/min per IP.
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/HouseholdExport"}}}}
      responses:
        "201": {description: Created, content: {application/json: {schema: {$ref: "#/components/schemas/ImportSummary"}}}}
        "400": {$ref: "#/components/responses/ImportInvalid"}
        "409": {$ref: "#/components/responses/ImportInvalid"}
        "413": {description: Upload larger than 5 MiB (body_too_large)}
        "429": {$ref: "#/components/responses/RateLimited"}
  /households/{hh}/import:
    parameters: [{$ref: "#/components/parameters/hh"}]
    post:
      tags: [households]
      summary: Merge an export file into this household (member)
      description: |
        Areas with the same name (case-insensitive) are combined; chores are added as new chores; assignees are matched to
        members by username (others become "anyone"); completers are matched by username, otherwise the completion is
        anonymous. Webhooks in the file are created only when the caller is an owner (disabled, new secrets). The household's own settings are never changed (areas in the file are added even when the household has areas turned off). One transaction: all or nothing. Rate limit 6/min per IP.
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/HouseholdExport"}}}}
      responses:
        "200": {description: Merged, content: {application/json: {schema: {$ref: "#/components/schemas/ImportSummary"}}}}
        "400": {$ref: "#/components/responses/ImportInvalid"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/ImportInvalid"}
        "413": {description: Upload larger than 5 MiB (body_too_large)}
        "429": {$ref: "#/components/responses/RateLimited"}
  /templates:
    get:
      security: [{cookieAuth: []}, {bearerAuth: [chores:read]}]
      tags: [chores]
      summary: Starter chore templates (the editor prefills from these)
      description: Names translate as template.<key>, areas as area.<area> in the front-end catalog.
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Template"}}}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
  /households:
    get:
      security: [{cookieAuth: []}, {bearerAuth: [chores:read]}]
      tags: [households]
      summary: The user's households
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Household"}}}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
    post:
      tags: [households]
      summary: Create a household (the user becomes owner)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, timezone]
              properties:
                name: {type: string, maxLength: 100}
                timezone: {type: string, description: IANA zone}
                areasEnabled: {type: boolean, default: false, description: Turn the areas feature on for the new household}
                starterAreas: {type: boolean, description: "Also create Kitchen, Bathroom, Garden, Exterior, Appliances and General, named in the user's language; ignored unless areasEnabled is true"}
      responses:
        "201": {description: Created, content: {application/json: {schema: {$ref: "#/components/schemas/Household"}}}}
        "400": {$ref: "#/components/responses/Invalid"}
        "409": {$ref: "#/components/responses/LimitReached"}
  /households/{hh}:
    parameters: [{$ref: "#/components/parameters/hh"}]
    get:
      security: [{cookieAuth: []}, {bearerAuth: [chores:read]}]
      tags: [households]
      summary: Household details (guest)
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Household"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
    patch:
      tags: [households]
      summary: Update settings (owner)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string}
                timezone: {type: string}
                quietHours: {type: object, nullable: true, properties: {start: {type: integer}, end: {type: integer}}}
                defaultReminderPreset: {type: string, enum: ["", gentle, nag, none]}
                areasEnabled: {type: boolean, description: Group chores by area (owner only; areas and links are kept when turned off)}
                starterAreas: {type: boolean, description: Create the starter areas if the household has none}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Household"}}}}
        "400": {$ref: "#/components/responses/Invalid"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /households/{hh}/members:
    parameters: [{$ref: "#/components/parameters/hh"}]
    get:
      tags: [households]
      summary: Members (guest)
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Member"}}}}}
        "404": {$ref: "#/components/responses/NotFound"}
  /households/{hh}/members/{user}:
    parameters: [{$ref: "#/components/parameters/hh"}, {name: user, in: path, required: true, schema: {type: string}}]
    patch:
      tags: [households]
      summary: Change a member's role (owner)
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [role], properties: {role: {$ref: "#/components/schemas/Role"}}}}}}
      responses:
        "204": {description: Changed}
        "400": {$ref: "#/components/responses/Invalid"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      tags: [households]
      summary: Remove a member (owner) or leave (self)
      description: |
        Leaving takes an optional body. As last owner with other non-guest members, newOwner names the successor
        (409 owner_required with the candidates otherwise). If nobody else (non-guest) remains the household is
        deleted, which needs confirmDelete true (409 household_would_be_deleted otherwise).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                newOwner: {type: string}
                confirmDelete: {type: boolean}
      responses:
        "204": {description: Removed}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {description: "owner_required or household_would_be_deleted", content: {application/json: {schema: {$ref: "#/components/schemas/OwnerRequired"}}}}
  /households/{hh}/invites:
    parameters: [{$ref: "#/components/parameters/hh"}]
    get:
      tags: [households]
      summary: Active invite links (owner)
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Invite"}}}}}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    post:
      tags: [households]
      summary: Create an invite link (owner); the token is returned once
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: {type: string, enum: [member, guest]}
                expiresInHours: {type: integer, minimum: 1, maximum: 720, default: 72, description: "The app offers 1, 3 (default) or 7 days"}
                maxUses: {type: integer, minimum: 1, maximum: 100, default: 1, description: How many people may join with the link}
      responses:
        "201": {description: Created, content: {application/json: {schema: {$ref: "#/components/schemas/Invite"}}}}
        "400": {$ref: "#/components/responses/Invalid"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/LimitReached"}
  /households/{hh}/invites/{invite}:
    parameters: [{$ref: "#/components/parameters/hh"}, {name: invite, in: path, required: true, schema: {type: string}}]
    delete:
      tags: [households]
      summary: Revoke an invite (owner)
      responses:
        "204": {description: Revoked}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /invites/{token}:
    parameters: [{name: token, in: path, required: true, schema: {type: string}}]
    get:
      tags: [households]
      summary: What an invite link joins (public; only while the link is valid)
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: object, required: [householdName], properties: {householdName: {type: string}, inviterName: {type: string, description: "Display name of whoever created the link; absent when that account no longer exists"}}}}}}
        "404": {description: "Unknown, revoked, expired or used-up link (all answer the same)", content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "429": {$ref: "#/components/responses/RateLimited"}
  /invites/{token}/accept:
    parameters: [{name: token, in: path, required: true, schema: {type: string}}]
    post:
      tags: [households]
      summary: Join a household with an invite link (signed in)
      responses:
        "200": {description: Joined, content: {application/json: {schema: {$ref: "#/components/schemas/Joined"}}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/LimitReached"}
        "429": {$ref: "#/components/responses/RateLimited"}
  /invites/{token}/register:
    parameters: [{name: token, in: path, required: true, schema: {type: string}}]
    post:
      tags: [households]
      summary: Create an account and join with an invite link
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/NewAccount"}}}}
      responses:
        "201": {description: Registered and signed in, content: {application/json: {schema: {$ref: "#/components/schemas/Session"}}}}
        "400": {$ref: "#/components/responses/Invalid"}
        "403": {description: registration_disabled}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/RateLimited"}
  /households/{hh}/areas:
    parameters: [{$ref: "#/components/parameters/hh"}]
    get:
      security: [{cookieAuth: []}, {bearerAuth: [chores:read]}]
      tags: [areas]
      summary: Areas by name (guest)
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Area"}}}}}
        "404": {$ref: "#/components/responses/NotFound"}
    post:
      security: [{cookieAuth: []}, {bearerAuth: [chores:write]}]
      tags: [areas]
      summary: Create an area (member; token scope chores:write)
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/AreaInput"}}}}
      responses:
        "201": {description: Created, content: {application/json: {schema: {$ref: "#/components/schemas/Area"}}}}
        "400": {$ref: "#/components/responses/Invalid"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {description: An area with that name exists (conflict)}
  /households/{hh}/areas/{area}:
    parameters: [{$ref: "#/components/parameters/hh"}, {name: area, in: path, required: true, schema: {type: string}}]
    patch:
      security: [{cookieAuth: []}, {bearerAuth: [chores:write]}]
      tags: [areas]
      summary: Rename an area (member)
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/AreaInput"}}}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Area"}}}}
        "400": {$ref: "#/components/responses/Invalid"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {description: An area with that name exists (conflict)}
    delete:
      security: [{cookieAuth: []}, {bearerAuth: [chores:write]}]
      tags: [areas]
      summary: Delete an area; its chores become area-less (member)
      responses:
        "204": {description: Deleted}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /households/{hh}/chores:
    parameters: [{$ref: "#/components/parameters/hh"}]
    get:
      security: [{cookieAuth: []}, {bearerAuth: [chores:read]}]
      tags: [chores]
      summary: Chores with computed due status (guest)
      description: Ordered by due time. status is relative to today in the household zone and the user's week start.
      parameters:
        - {name: mine, in: query, schema: {type: string, enum: ["1"]}, description: Assigned to me or to anyone}
        - {name: area, in: query, schema: {type: string}, description: Area ID}
        - {name: archived, in: query, schema: {type: string, enum: ["1"]}, description: List archived chores instead of active ones}
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Chore"}}}}}
        "404": {$ref: "#/components/responses/NotFound"}
    post:
      security: [{cookieAuth: []}, {bearerAuth: [chores:write]}]
      tags: [chores]
      summary: Create a chore (member)
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/ChoreInput"}}}}
      responses:
        "201": {description: Created, content: {application/json: {schema: {$ref: "#/components/schemas/Chore"}}}}
        "400": {$ref: "#/components/responses/Invalid"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/LimitReached"}
  /households/{hh}/chores/suggest:
    parameters: [{$ref: "#/components/parameters/hh"}]
    post:
      security: [{cookieAuth: []}]
      tags: [chores]
      summary: Suggest chores from plain language with the instance's AI model (member, session only)
      description: |
        Optional; 409 ai_disabled unless an admin has configured an OpenAI-compatible endpoint (GET /instance
        has aiEnabled). Sends the text, the household's area names (when areas are on), the display names of
        members who are not guests and today's date to the model; nothing else. Creates nothing: each
        suggestion has the shape of ChoreInput and passed the same validation, so the app can show it for
        review and then create it with POST /households/{hh}/chores. Suggestions the model got wrong are
        left out and counted in dropped. At most 20 suggestions. Per user at most ai_requests_per_user_day
        requests in 24 hours (429 with Retry-After); 503 ai_busy while the instance already has 4 requests in
        flight. 502 when the model fails; kind is one of unreachable, auth, not_found, rate_limited,
        timeout, bad_response, server_error.
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [text], properties: {text: {type: string, maxLength: 2000, description: "What to do, in any language"}}}
      responses:
        "200":
          description: Suggestions to review
          content:
            application/json:
              schema:
                type: object
                properties:
                  suggestions: {type: array, items: {$ref: "#/components/schemas/ChoreInput"}}
                  dropped: {type: integer}
        "400": {$ref: "#/components/responses/Invalid"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {description: "AI suggestions are off (ai_disabled)", content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "429": {$ref: "#/components/responses/RateLimited"}
        "502": {description: "The model failed", content: {application/json: {schema: {type: object, properties: {error: {type: string, example: ai_failed}, kind: {type: string}}}}}}
        "503": {description: "Too many AI requests in flight (ai_busy)", content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /households/{hh}/chores/{chore}:
    parameters: [{$ref: "#/components/parameters/hh"}, {$ref: "#/components/parameters/chore"}]
    get:
      security: [{cookieAuth: []}, {bearerAuth: [chores:read]}]
      tags: [chores]
      summary: One chore (guest)
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Chore"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
    put:
      security: [{cookieAuth: []}, {bearerAuth: [chores:write]}]
      tags: [chores]
      summary: Replace the editable fields (member); simple and advanced editors share this
      description: The current occurrence is kept unless schedule.firstDue or kind changes. Pause state and a custom reminder preset are kept.
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/ChoreInput"}}}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Chore"}}}}
        "400": {$ref: "#/components/responses/Invalid"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    patch:
      security: [{cookieAuth: []}, {bearerAuth: [chores:complete]}]
      tags: [chores]
      summary: Set whose turn it is on a chore that takes turns (member)
      description: Body {turnUserId}, one of the chore's assignees. 409 when the chore does not take turns or is archived. API tokens need `chores:complete`.
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [turnUserId], properties: {turnUserId: {type: string}}}}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Chore"}}}}
        "400": {$ref: "#/components/responses/Invalid"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {description: The chore does not take turns or is archived}
    delete:
      security: [{cookieAuth: []}, {bearerAuth: [chores:write]}]
      tags: [chores]
      summary: Delete a chore and its history (member); audited
      responses:
        "204": {description: Deleted}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /households/{hh}/chores/{chore}/archive:
    parameters: [{$ref: "#/components/parameters/hh"}, {$ref: "#/components/parameters/chore"}]
    post:
      security: [{cookieAuth: []}, {bearerAuth: [chores:write]}]
      tags: [chores]
      summary: Archive (keeps history, stops reminders; member)
      responses:
        "204": {description: Archived}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /households/{hh}/chores/{chore}/unarchive:
    parameters: [{$ref: "#/components/parameters/hh"}, {$ref: "#/components/parameters/chore"}]
    post:
      security: [{cookieAuth: []}, {bearerAuth: [chores:write]}]
      tags: [chores]
      summary: Unarchive (member)
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Chore"}}}}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /households/{hh}/chores/{chore}/complete:
    parameters: [{$ref: "#/components/parameters/hh"}, {$ref: "#/components/parameters/chore"}]
    post:
      security: [{cookieAuth: []}, {bearerAuth: [chores:complete]}]
      tags: [chores]
      summary: Mark done from the app (member)
      description: Advances a recurring chore to its next occurrence; a one-off chore is archived. undoPath is the revert endpoint for this completion.
      requestBody:
        required: false
        content: {application/json: {schema: {type: object, properties: {note: {type: string, maxLength: 2000}}}}}
      responses:
        "201":
          description: Completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  completion: {$ref: "#/components/schemas/Completion"}
                  chore: {$ref: "#/components/schemas/Chore"}
                  undoPath: {type: string}
        "400": {$ref: "#/components/responses/Invalid"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {description: Chore is archived (conflict)}
  /households/{hh}/chores/{chore}/completions:
    parameters: [{$ref: "#/components/parameters/hh"}, {$ref: "#/components/parameters/chore"}]
    get:
      security: [{cookieAuth: []}, {bearerAuth: [chores:read]}]
      tags: [chores]
      summary: Completion history, newest first (guest)
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
        - {name: after, in: query, schema: {type: string}, description: The next value of the previous page}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/Completion"}}
                  next: {type: string, description: Cursor for the next page; empty on the last}
        "400": {$ref: "#/components/responses/Invalid"}
        "404": {$ref: "#/components/responses/NotFound"}
  /households/{hh}/chores/{chore}/completions/{completion}/revert:
    parameters: [{$ref: "#/components/parameters/hh"}, {$ref: "#/components/parameters/chore"}, {name: completion, in: path, required: true, schema: {type: string}}]
    post:
      security: [{cookieAuth: []}, {bearerAuth: [chores:complete]}]
      tags: [chores]
      summary: Revert a completion (member); restores the previous due date; audited
      responses:
        "200": {description: The chore afterwards, content: {application/json: {schema: {$ref: "#/components/schemas/Chore"}}}}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {description: Already reverted (conflict)}
  /households/{hh}/chores/{chore}/snooze:
    parameters: [{$ref: "#/components/parameters/hh"}, {$ref: "#/components/parameters/chore"}]
    post:
      security: [{cookieAuth: []}, {bearerAuth: [chores:complete]}]
      tags: [chores]
      summary: Move this occurrence to a date (member); invalidates mark-done links
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [until], properties: {until: {type: string, format: date, description: "Local date, today or later"}}}}}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Chore"}}}}
        "400": {$ref: "#/components/responses/Invalid"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {description: Chore is archived (conflict)}
  /households/{hh}/chores/{chore}/skip:
    parameters: [{$ref: "#/components/parameters/hh"}, {$ref: "#/components/parameters/chore"}]
    post:
      security: [{cookieAuth: []}, {bearerAuth: [chores:complete]}]
      tags: [chores]
      summary: Skip once - advance to the next occurrence without a completion (member); audited
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Chore"}}}}
        "400": {description: One-off chores do not repeat (invalid), content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {description: "Archived, or no further occurrence (conflict, no_next_occurrence)"}
  /households/{hh}/chores/{chore}/pause:
    parameters: [{$ref: "#/components/parameters/hh"}, {$ref: "#/components/parameters/chore"}]
    post:
      security: [{cookieAuth: []}, {bearerAuth: [chores:complete]}]
      tags: [chores]
      summary: Pause until a date, or indefinitely without one (member)
      requestBody:
        required: false
        content: {application/json: {schema: {type: object, properties: {until: {type: string, format: date, description: "Local date after today"}}}}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Chore"}}}}
        "400": {$ref: "#/components/responses/Invalid"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {description: Chore is archived (conflict)}
  /households/{hh}/chores/{chore}/resume:
    parameters: [{$ref: "#/components/parameters/hh"}, {$ref: "#/components/parameters/chore"}]
    post:
      security: [{cookieAuth: []}, {bearerAuth: [chores:complete]}]
