    get:
      tags: [push]
      summary: The VAPID public key a browser subscribes to Web Push with (signed in)
      description: Generated on first use; the private half is stored encrypted. Base64url, uncompressed P-256 point (applicationServerKey).
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: object, properties: {publicKey: {type: string}}}}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
  /account/push-subscriptions:
    get:
      tags: [push]
      summary: The caller's browser push subscriptions
