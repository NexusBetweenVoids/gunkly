      type: object
      properties:
        every: {type: integer, minimum: 1, maximum: 1000}
        unit: {type: string, enum: [day, week, month]}
    Schedule:
      type: object
      required: [firstDue]
      description: |
        type interval (with interval) or rrule (supported RRULE subset, ADR 0005).
        anchor defaults to from_completion for intervals and from_scheduled for rules.
        firstDue is a local date; for rules the first occurrence on or after it is the first due date.
        One-off chores send only firstDue.
        A rule that never produces a date (FREQ=YEARLY;BYMONTH=2;BYMONTHDAY=30) is refused with invalid at schedule
        (or schedule.rrule when it does not parse). Spaces around rule parts and empty parts are ignored.
        When an update changes the schedule but not firstDue, the current due date moves to the first occurrence of
        the new schedule on or after it (it stays when the new schedule already produces it).
      properties:
        type: {type: string, enum: [interval, rrule]}
        interval: {$ref: "#/components/schemas/Interval"}
        rrule: {type: string}
        anchor: {type: string, enum: [from_completion, from_scheduled]}
        firstDue: {type: string, format: date}
    ChoreInput:
      type: object
      required: [name, schedule]
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        notes: {type: string, maxLength: 10000}
        link: {type: string, description: http or https URL}
        areaId: {type: string, nullable: true, description: "On update, omitted keeps the current area and null clears it"}
        kind: {type: string, enum: [recurring, oneoff], default: recurring}
        schedule: {$ref: "#/components/schemas/Schedule"}
        assignees: {type: array, items: {type: string}, description: "Non-guest member user IDs; empty = anyone. The order is the rotation order when rotation is on."}
        rotation: {type: boolean, description: '"Take turns": needs 2+ assignees and a recurring chore (else 400). Omitted on update keeps it, but it stops when the assignees or kind no longer allow it.'}
        advanceOn: {type: string, enum: [any, assignee], description: 'any (default): completing passes the turn to the completer''s successor. assignee: only the person whose turn it is moves it on. Omitted on update keeps the current one.'}
        reminderPreset: {type: string, enum: ["", gentle, nag, none], description: Omitted on update keeps the current one}
        reminderTime: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', example: "07:30", description: "Optional time of day (HH:MM, household time zone) for all of the chore's reminders. The preset's reminders (or the chore's custom ones) are stored with this time and the chore's reminderPreset becomes custom; its reminders are then readable and editable at /reminders. Omitted or empty leaves reminders unchanged; ignored when there are no reminders (preset none). Invalid values give 400."}
    Chore:
      type: object
      properties:
        id: {type: string}
        areaId: {type: string, nullable: true}
        name: {type: string}
        notes: {type: string}
        link: {type: string}
        kind: {type: string, enum: [recurring, oneoff]}
        schedule: {$ref: "#/components/schemas/Schedule"}
        dueDate: {type: string, format: date, description: Local date of the current occurrence}
        nextDue: {type: string, format: date-time, nullable: true}
        status: {type: string, enum: [overdue, today, thisWeek, later, none, paused, archived]}
        pausedUntil: {type: string, format: date-time, nullable: true}
        pausedIndefinitely: {type: boolean}
        archivedAt: {type: string, format: date-time, nullable: true}
        reminderPreset: {type: string, description: '"" = household default, custom = own reminders'}
        assignees: {type: array, items: {type: string}, description: In rotation order}
        rotation: {type: boolean}
        advanceOn: {type: string, enum: [any, assignee]}
        turnUserId: {type: string, nullable: true, description: Whose turn it is; null unless rotation}
        turnName: {type: string, nullable: true, description: "Display name (username when empty) of the member whose turn it is; null unless rotation. Lets API tokens, which cannot list members, show the name"}
        reminderTime: {type: string, nullable: true, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', example: "09:00", description: "When the chore's due-day reminder goes off (HH:MM, household time zone), from its own reminders or its preset (the household default when reminderPreset is empty); null when it has no due-day reminder."}
        muted: {type: boolean, description: Muted by the caller}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    Completion:
      type: object
      properties:
        id: {type: string}
        choreId: {type: string}
        userId: {type: string, nullable: true}
        completedAt: {type: string, format: date-time}
        source: {type: string, enum: [app, mark_done_link, api_token, oauth, import]}
        via: {type: string, description: "Name of the connected app behind an oauth completion; absent when unknown."}
        note: {type: string}
        revertedAt: {type: string, format: date-time, nullable: true}
    Reminder:
      type: object
      required: [kind, minute]
      properties:
        kind: {type: string, enum: [before, "on", overdue]}
        days: {type: integer, minimum: 1, maximum: 365, description: "Before: days ahead. Overdue: repeat every N days (at least 1). Ignored for on."}
        minute: {type: integer, minimum: 0, maximum: 1439, description: Local time of day in minutes after midnight}
    RemindersView:
      type: object
      properties:
        preset: {type: string}
        effectivePreset: {type: string}
        reminders: {type: array, items: {$ref: "#/components/schemas/Reminder"}}
x-outside-api-v1:
  description: |
    Session-less, token-addressed endpoints served outside /api/v1 (hence
    not under paths:). Tokens are secrets; every failure answers one generic
    page or 404.
  routes:
    "GET /healthz/email": 'Email delivery probe for uptime monitors, unauthenticated, no details. 200 {"status":"ok"} normally, 200 {"status":"disabled"} while email is off, 503 {"error":{"code":"email_failing"}} while sends are failing (the same condition as emailFailing in /admin/health). /readyz is not affected.'
    "GET /done/{token}": Confirmation page for a mark-done link (HTML, no side effects). Rate limit 30/min per IP.
    "POST /done/{token}": Completes the occurrence the link addresses and shows an undo form (HTML form post, CSRF-checked by Origin/Sec-Fetch-Site). Rate limit 30/min per IP.
    "POST /done/undo/{token}": Reverts that completion within 5 minutes (HTML). Rate limit 30/min per IP.
    "GET /done.css": Stylesheet of the mark-done pages.
    "GET /ical/{file}": Read-only iCalendar feed; {file} is "<token>.ics". Rate limit 60/min per IP.
    "POST /mcp": |
      MCP (Model Context Protocol) server for AI assistants, Streamable HTTP transport (ADR 0015), stateless: JSON-RPC
      over POST, no session id, no server push. Requires "Authorization: Bearer gk_..." with any API token (cookies are
      never read and no CSRF token is needed); a missing or invalid token answers 401 with "WWW-Authenticate: Bearer"
      (with OAuth on, `Bearer resource_metadata="<base>/.well-known/oauth-protected-resource"`). With OAuth on an OAuth access
      token ("gko_...", ADR 0016) is accepted as well, with the scopes, households and live role checks of an API token.
      A request whose Origin header is present and is not this instance's origin (GUNKLY_BASE_URL, else the Host) answers
      403 origin_not_allowed. 404 when the instance admin turned mcpEnabled off. Request bodies are capped at 1 MiB.
      Per-token (120/min) and per-IP (300/min) rate limits as for the REST API. tools/list shows only the tools the
      token's scopes allow: list_households, list_chores, get_chore, upcoming (chores:read); complete_chore,
      undo_completion, snooze_chore, skip_chore (chores:complete); create_chore (chores:write). Every tool applies the
      token's household binding and its owner's current role, like the REST routes; a missing scope or role is a tool
      error. Results are JSON text; chore names and notes in them are untrusted user data.
    "GET /.well-known/security.txt": |
      RFC 9116 security contact file (text/plain): Contact (GUNKLY_SECURITY_CONTACT), Expires (180 days ahead, generated per
      request), Policy (GUNKLY_SECURITY_POLICY, optional), Preferred-Languages, Canonical (with GUNKLY_BASE_URL). 404 while no
      contact is configured. Other paths with a segment starting with "." (for example /.env) are 404, never the app shell.
    "GET /.well-known/oauth-protected-resource": |
      RFC 9728 protected resource metadata of /mcp (ADR 0016): resource, authorization_servers, scopes_supported,
      bearer_methods_supported ["header"]. 404 unless the instance admin turned oauthEnabled on (and GUNKLY_BASE_URL is https).
    "GET /.well-known/oauth-protected-resource/mcp": The same document at the path-suffixed well-known URI for the resource /mcp (RFC 9728 section 3.1). 404 while OAuth is off.
    "GET /.well-known/oauth-authorization-server": |
      RFC 8414 authorization server metadata: issuer (the base URL), authorization_endpoint /oauth/authorize, token_endpoint
      /oauth/token, registration_endpoint /oauth/register, revocation_endpoint /oauth/revoke, response_types ["code"],
      grant_types ["authorization_code","refresh_token"], code_challenge_methods ["S256"] only, token_endpoint_auth_methods
      ["none"] (public clients), scopes_supported, authorization_response_iss_parameter_supported. 404 while OAuth is off.
    "POST /oauth/register": |
      RFC 7591 dynamic client registration for public clients (JSON; no authentication). redirect_uris: 1 to 5 exact URIs,
      https or http on localhost/127.0.0.1/[::1] (any port), no fragment or wildcard. client_name: at most 100 characters,
      shown on the consent page escaped and labelled unverified. 201 with client_id (no secret; token_endpoint_auth_method is
      always "none"); 400 invalid_redirect_uri or invalid_client_metadata; 503 temporarily_unavailable at the instance cap
      of registered clients (oauth_clients, default 1000). Rate limit 10/min per IP. Clients never used are deleted after 24 h.
      404 while OAuth is off.
    "GET /oauth/authorize": |
      Authorization endpoint (HTML). Query: response_type=code, client_id, redirect_uri (exact match with a registered one),
      code_challenge and code_challenge_method=S256 (required), state, scope (subset of chores:read chores:complete chores:write),
      resource (must equal <base>/mcp when given, RFC 8707). A bad client_id or redirect_uri shows an error page (never a
      redirect); other faults redirect to the client with error=invalid_request, unsupported_response_type, invalid_scope or
      invalid_target plus state and iss. Without a session it redirects (303) to /signin?next=... and back. Otherwise it renders
      a server-side consent page where the user picks households and actions; it works without script, and one same-origin script (/oauth-consent.js) adds "Confirm with a passkey" for accounts that have one. Never cached. Rate limit 60/min per IP.
      404 while OAuth is off.
    "POST /oauth/authorize": |
      The consent form post (HTML form; CSRF: the gunkly_csrf cookie must equal the hidden csrf field, plus the cross-site
      check). decision=allow issues a single-use authorization code (60 s, hashed at rest) and redirects (303) to the redirect
      URI with code, state and iss; anything else redirects with error=access_denied. Unless the session re-verified in the last
      15 minutes, allow needs the password (and second factor), or an optional passkey field: the JSON {challenge, credential}
      of a user-verified assertion for a challenge issued to this session by POST /oauth/authorize/passkey, which the server
      verifies itself. decision=sso redirects (303) to the identity provider to re-verify (prompt=login, max_age=0) and
      returns to the same consent request. Rate limit 60/min per IP. 404 while OAuth is off.
    "POST /oauth/authorize/passkey": |
      The consent page's script asks here for the options of a passkey assertion (JSON, user verification required) for the
      signed-in user's passkeys. The challenge is single use, five minutes, bound to the account, the session and this
      purpose. CSRF as the consent form (csrf field). 401 without a session, 404 without passkeys or while OAuth is off.
      Rate limit 20/min per IP.
    "GET /oauth-consent.js": "The consent page's script (progressive enhancement: passkey confirmation). 404 while OAuth is off."
    "POST /oauth/token": |
      Token endpoint (form encoded, public clients: client_id, no secret). grant_type=authorization_code with code,
      redirect_uri, code_verifier (PKCE S256) and optional resource; or grant_type=refresh_token with refresh_token. Answers
      {access_token "gko_...", token_type Bearer, expires_in 3600, refresh_token "gkr_...", scope}. Refresh tokens rotate on
      every use (30 days idle, 90 days absolute per grant); presenting a used code or rotated refresh token revokes the whole
      grant. Errors are RFC 6749 JSON {"error": ...}: invalid_request, invalid_client, invalid_grant, invalid_target,
      unsupported_grant_type. No-store. Rate limit 60/min per IP. 404 while OAuth is off. Access tokens are accepted by
      POST /mcp only, never by the REST API.
    "POST /oauth/revoke": RFC 7009 revocation (form encoded token, client_id). Revoking an access or refresh token revokes its grant. Always 200 {} (no oracle). Rate limit 60/min per IP. 404 while OAuth is off.
    "GET /mcp": "405 (stateless server: no server-to-client stream). Authenticated like POST /mcp."
    "DELETE /mcp": "405 (stateless server: nothing to terminate). Authenticated like POST /mcp."
    "GET /metrics": |
      Prometheus text exposition (format 0.0.4). Registered only when GUNKLY_METRICS_TOKEN is set; requires
      "Authorization: Bearer <token>" (constant-time compare, otherwise 401). Rate limit 30/min per IP. Series:
      gunkly_build_info{version}, process_start_time_seconds, go_goroutines, go_memstats_alloc_bytes,
      gunkly_http_requests_total{route,code} (route pattern, status class), gunkly_http_request_duration_seconds
      (histogram), gunkly_deliveries_total{kind,result}, gunkly_scheduler_last_tick_age_seconds,
      gunkly_delivery_queue_depth, gunkly_db_open_connections. No per-user or per-household labels.
