        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/LimitReached"}
  /households/{hh}/webhooks/{id}:
    parameters: [{$ref: "#/components/parameters/hh"}, {$ref: "#/components/parameters/id"}]
    get:
      tags: [webhooks]
      summary: One webhook (owner)
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Webhook"}}}}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    patch:
      tags: [webhooks]
      summary: Change a webhook (owner). Setting active to true also clears an automatic switch-off.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url: {type: string, description: Write-only; replaces the URL}
                description: {type: string, maxLength: 200}
                events: {type: array, minItems: 1, items: {$ref: "#/components/schemas/WebhookEvent"}}
                active: {type: boolean}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Webhook"}}}}
        "400": {description: "Invalid input (invalid, invalid_json, invalid_webhook_url)", content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      tags: [webhooks]
      summary: Delete a webhook and its delivery log (owner)
      responses:
        "204": {description: Deleted}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /households/{hh}/webhooks/{id}/rotate-secret:
    parameters: [{$ref: "#/components/parameters/hh"}, {$ref: "#/components/parameters/id"}]
    post:
      tags: [webhooks]
      summary: Replace the signing secret (owner, step-up); the new secret is shown once and the old one stops signing at once
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/WebhookCreated"}}}}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /households/{hh}/webhooks/{id}/test:
    parameters: [{$ref: "#/components/parameters/hh"}, {$ref: "#/components/parameters/id"}]
    post:
      tags: [webhooks]
      summary: Send a signed ping event now (owner); not retried, and logged like a delivery
      responses:
        "200": {description: The logged attempt, content: {application/json: {schema: {$ref: "#/components/schemas/WebhookDelivery"}}}}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/RateLimited"}
  /households/{hh}/webhooks/{id}/deliveries:
    parameters: [{$ref: "#/components/parameters/hh"}, {$ref: "#/components/parameters/id"}]
    get:
      tags: [webhooks]
      summary: The webhook's delivery log, the last 50, newest first (owner)
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: "#/components/schemas/WebhookDelivery"}}}}}}}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /admin/users:
    get:
      tags: [admin]
      summary: All accounts (admin)
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/AdminUser"}}}}}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      tags: [admin]
      summary: Create an account (admin, step-up)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/NewAccount"
                - type: object
                  properties: {isAdmin: {type: boolean}}
      responses:
        "201": {description: Created, content: {application/json: {schema: {$ref: "#/components/schemas/AdminUser"}}}}
        "400": {$ref: "#/components/responses/Invalid"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {description: Username or email taken (conflict)}
  /admin/users/{id}/reset-password:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}]
    post:
      tags: [admin]
      summary: Set a new random password for a non-admin account (admin, step-up); returned once
      description: Disabled in hosted mode (403 disabled_in_hosted_mode) and refused for admin accounts (403 admin_target). The reset is written to the target's own audit log and signs them out everywhere.
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: object, properties: {password: {type: string}}}}}}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /admin/health:
    get:
      tags: [admin]
      summary: Reverse-proxy misconfiguration hints (admin)
      description: |
        Lists up to 5 direct peers seen in the last 24 hours that are not trusted proxies but sent
        X-Forwarded-For, Forwarded or X-Real-IP, most recent first. Such a peer is probably a reverse proxy
        missing from GUNKLY_TRUSTED_PROXIES: client addresses and per-IP rate limits then use the proxy's
        address. Kept in memory only (lost on restart), never logged and never trusted automatically.
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/AdminHealth"}}}}
        "403": {$ref: "#/components/responses/Forbidden"}
  /admin/updates:
    get:
      tags: [admin]
      summary: Running version and the latest release (admin)
      description: |
        Returns the cached result of the release check at once. If the cache is missing, older than one hour or
        older than the running version, a refresh from the GitHub Releases API (User-Agent "gunkly-update-check",
        no instance data) starts in the background and checking is true until it ends; ask again in a few
        seconds. At most one request is in flight and at most one is made per 5 minutes. With updateCheck off,
        nothing is shown and GitHub is never asked (enabled false). changelog is plain text: show it as text,
        never as HTML.
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Updates"}}}}
        "403": {$ref: "#/components/responses/Forbidden"}
  /admin/updates/check:
    post:
      tags: [admin]
      summary: Check for a new release now (admin)
      description: |
        Starts the same background refresh as GET /admin/updates, even if the cache is fresh. Within 5 minutes
        of the previous request to GitHub, or with updateCheck off, nothing is requested. Returns the current
        state; checking is true while a refresh is running.
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Updates"}}}}
        "403": {$ref: "#/components/responses/Forbidden"}
  /admin/updates/apply:
    post:
      tags: [admin]
      summary: Ask the configured updater to update Gunkly (admin, recent step-up)
      description: |
        Calls the update webhook set in Administration (updates.webhook_url, or GUNKLY_UPDATE_WEBHOOK_URL) once:
        POST with an empty body and "Authorization: Bearer <token>" when updates.webhook_token is set. With
        updates.webhook_kind dockhand the body is {"pull":true} (application/json), for Dockhand's stack deploy
        API. Gunkly never touches the container runtime. result is accepted (2xx), sent (no answer within 15 s: the updater may be
        restarting Gunkly), or failed with error unreachable or rejected (and the HTTP status). 409
        update_webhook_missing when none is configured. Audited as admin_update_requested.
      responses:
        "200": {description: Result, content: {application/json: {schema: {type: object, properties: {result: {type: string, enum: [accepted, sent, failed]}, error: {type: string}, status: {type: integer}}}}}}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {description: "No update webhook (update_webhook_missing)", content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /admin/config:
    get:
      tags: [admin]
      summary: Configuration set in Administration (admin)
      description: |
        Settings an admin can change here instead of in the server's environment: ai.* (AI endpoint), email.*
        (SMTP), sso.* (OpenID Connect), metrics.token and signup.pow_max. An environment variable always wins:
        its field is locked and shows the environment's value (never for secrets). Email and single sign-on
        are groups: one of their variables in the environment locks the whole group. Secret fields
        (ai.key, email.password, sso.client_secret, metrics.token) never return a value, only set. Changes
        take effect at once, without a restart.
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/AdminConfig"}}}}
        "403": {$ref: "#/components/responses/Forbidden"}
    patch:
      tags: [admin]
      summary: Change configuration (admin, recent step-up)
      description: |
        values maps keys to new values; null or "" resets a key to its default. Secrets are stored encrypted
        with the instance's secret key. 409 set_by_environment for a key set in the environment. Audited by key
        name, never with values.
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [values], properties: {values: {type: object, additionalProperties: {type: string, nullable: true}}}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/AdminConfig"}}}}
        "400": {$ref: "#/components/responses/Invalid"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {description: "The key is set in the environment (set_by_environment)", content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /admin/services:
    get:
      tags: [admin]
      summary: Whether email, single sign-on and metrics are running (admin)
      description: |
        Reflects the configuration in effect (environment first, then Administration). emailProblem and
        ssoProblem say why a configured service is not running: incomplete, or needs_https (single sign-on
        needs an https GUNKLY_BASE_URL, or localhost).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {type: object, properties: {emailOn: {type: boolean}, emailProblem: {type: string}, ssoOn: {type: boolean}, ssoProblem: {type: string}, ssoAvailable: {type: boolean}, ssoCallback: {type: string}, metricsOn: {type: boolean}}}
        "403": {$ref: "#/components/responses/Forbidden"}
  /admin/email/test:
    post:
      tags: [admin]
      summary: Send a test email with the current settings (admin)
      description: Sends at once (not through the outbox) and counts against the admin's hourly email quota. 409 email_disabled while email is off.
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [to], properties: {to: {type: string, format: email}}}
      responses:
        "200": {description: Result, content: {application/json: {schema: {type: object, properties: {ok: {type: boolean}, error: {type: string, example: send_failed}}}}}}
        "400": {$ref: "#/components/responses/Invalid"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {description: "Email is off (email_disabled)", content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "429": {$ref: "#/components/responses/RateLimited"}
  /admin/sso/test:
    post:
      tags: [admin]
      summary: Check that the single sign-on provider answers (admin)
      description: Fetches the provider's discovery document. The client ID and secret are only checked by a real sign-in. 409 sso_disabled while it is off.
      responses:
        "200": {description: Result, content: {application/json: {schema: {type: object, properties: {ok: {type: boolean}, authOrigin: {type: string}}}}}}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {description: "Single sign-on is off (sso_disabled)", content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /admin/ai/test:
    post:
      tags: [admin]
      summary: Test the saved AI endpoint (admin)
      description: Sends a tiny request to the configured model. 409 ai_disabled when AI is off or incomplete.
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema: {type: object, properties: {ok: {type: boolean}, ms: {type: integer}, error: {type: string, description: "unreachable, auth, not_found, rate_limited, timeout, bad_response or server_error"}}}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {description: "AI is off (ai_disabled)", content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /admin/settings:
    get:
      tags: [admin]
      summary: Instance settings and effective limits (admin)
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/AdminSettings"}}}}
        "403": {$ref: "#/components/responses/Forbidden"}
    patch:
      tags: [admin]
      summary: Update instance settings (admin, step-up)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                openSignup: {type: boolean}
                requirePow: {type: boolean, description: "Sign-up proof of work (default on in hosted mode)"}
                inviteRegistration: {type: boolean}
                minPasswordLength: {type: integer, minimum: 8, maximum: 128}
                sessionIdleDays: {type: integer, minimum: 1, maximum: 365, description: "Sign out after this many days without use (default 30); must not exceed sessionMaxDays"}
                sessionMaxDays: {type: integer, minimum: 1, maximum: 730, description: "Absolute session lifetime in days from sign-in (default 90)"}
                auditRetentionDays: {type: integer, minimum: 1, maximum: 3650, description: "Audit log entries older than this are deleted daily (default 90)"}
                deliveryRetentionDays: {type: integer, minimum: 1, maximum: 3650, description: "Delivery log entries older than this are deleted daily (default 30)"}
                limits: {type: object, additionalProperties: {type: integer}, description: "0 resets a limit to its default"}
                enabledNotificationKinds: {type: array, items: {type: string}, description: "Allowed notification services; must be a subset of availableNotificationKinds"}
                egressGuard: {type: boolean, description: "Block outbound requests to private addresses; rejected while egressGuardLocked"}
                updateCheck: {type: boolean, description: "Check for new releases in the background (default true)"}
                securityAlerts: {type: boolean, description: "Email admins about suspicious activity, such as a household hitting the daily invite limit (default true)"}
                mcpEnabled: {type: boolean, description: "Serve the MCP endpoint /mcp for AI assistants (default true); off answers 404"}
                oauthEnabled: {type: boolean, description: "Let MCP clients such as ChatGPT sign in with OAuth (ADR 0016); default false. Turning it on needs GUNKLY_BASE_URL to be https (or http on localhost), else 400 oauth_requires_https. While off every /oauth endpoint and /.well-known/oauth-* document answers 404."}
                webhooksEnabled: {type: boolean, description: "Let household owners add outgoing webhooks (ADR 0017); default false. While off every webhook route answers 404 and nothing is sent; queued deliveries are dropped."}
                ssoCreateAccounts: {type: boolean, description: "A first sign-in by an unknown single sign-on user creates an account (ADR 0018); default false, when the sign-in ends on a 'no account linked' page"}
                ssoName: {type: string, maxLength: 50, description: "Provider name on the single sign-on button (\"Sign in with ...\"); empty = GUNKLY_OIDC_NAME, else the generic label"}
                inactiveEnabled: {type: boolean, description: "Warn and then delete inactive accounts (default off)"}
                inactiveWarnAfterDays: {type: integer, minimum: 30, maximum: 3650, description: "Warn after this many days without activity (default 365)"}
                inactiveDeleteAfterDays: {type: integer, minimum: 60, maximum: 3650, description: "Delete after this many days without activity (default 548); at least 30 days after inactiveWarnAfterDays"}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/AdminSettings"}}}}
        "400": {$ref: "#/components/responses/Invalid"}
        "403": {$ref: "#/components/responses/Forbidden"}
components:
  securitySchemes:
    cookieAuth: {type: apiKey, in: cookie, name: gunkly_session, description: Browser session; unsafe methods also send X-CSRF-Token}
    bearerAuth:
      type: http
      scheme: bearer
      description: "API token (gk_...). Scopes: chores:read, chores:complete, chores:write; no scope implies another."
  parameters:
    hh: {name: hh, in: path, required: true, schema: {type: string}, description: Household ID}
    chore: {name: chore, in: path, required: true, schema: {type: string}, description: Chore ID}
    id: {name: id, in: path, required: true, schema: {type: string}}
    limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
    before: {name: before, in: query, schema: {type: string}, description: Opaque cursor from a previous page's next}
  responses:
    ChannelInvalid: {description: "Invalid input (invalid, invalid_json, invalid_channel_url, service_disabled)", content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
    TestResult:
      description: Test outcome; error text is redacted
      content: {application/json: {schema: {type: object, properties: {sent: {type: boolean}, error: {type: string}}}}}
    Invalid: {description: "Validation failed (invalid, invalid_json)", content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
    UnauthenticatedBearer: {description: "Missing, unknown, expired or revoked token (unauthenticated)", headers: {WWW-Authenticate: {schema: {type: string, example: Bearer}}}, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
    Unauthenticated: {description: Not signed in (unauthenticated), content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
    Forbidden: {description: "Role too low, CSRF failure or step-up needed (forbidden, csrf_failed, step_up_required, token_not_allowed, insufficient_scope)", content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
    NotFound: {description: "Not found, or not a member of the household (not_found)", content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
    ImportInvalid:
      description: The file was rejected (code import_invalid; limit_reached when the household is already full)
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  code: {type: string, enum: [import_invalid, limit_reached]}
                  reason: {type: string, enum: [not_json, format, version, required, invalid, too_long, limit_chores, limit_areas, limit_reminders, limit_completions]}
                  path: {type: string, description: "Offending field, e.g. chores[3].schedule.rrule"}
    LimitReached: {description: A usage limit was reached (limit_reached), content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
    RateLimited: {description: Too many attempts (rate_limited), headers: {Retry-After: {schema: {type: integer}}}, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  schemas:
    TokenHousehold:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        role: {type: string, enum: [guest, member, owner], description: The token owner's current role}
    Token:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        scopes: {type: array, items: {type: string, enum: ["chores:read", "chores:complete", "chores:write"]}}
        households: {type: array, items: {$ref: "#/components/schemas/TokenHousehold"}}
        createdAt: {type: string, format: date-time}
        lastUsedAt: {type: string, format: date-time, nullable: true, description: Updated at most once a minute}
        expiresAt: {type: string, format: date-time, nullable: true}
        token: {type: string, description: "The secret, only in the creation response"}
    OAuthGrant:
      type: object
      properties:
        id: {type: string}
        name: {type: string, description: "The app's self-chosen name (unverified)"}
        scopes: {type: array, items: {type: string, enum: ["chores:read", "chores:complete", "chores:write"]}}
        households: {type: array, items: {$ref: "#/components/schemas/TokenHousehold"}}
        createdAt: {type: string, format: date-time}
        lastUsedAt: {type: string, format: date-time, nullable: true}
    TokenSelf:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        scopes: {type: array, items: {type: string, enum: ["chores:read", "chores:complete", "chores:write"]}}
        households: {type: array, items: {$ref: "#/components/schemas/TokenHousehold"}}
        user:
          type: object
          properties:
            id: {type: string}
            displayName: {type: string}
        expiresAt: {type: string, format: date-time, nullable: true}
    Error:
      type: object
      properties:
        error: {type: object, properties: {code: {type: string}}}
    ImportSummary:
      type: object
      properties:
        household: {type: object, properties: {id: {type: string}, name: {type: string}}}
        areasCreated: {type: integer}
        areasMerged: {type: integer, description: File areas that matched an existing area by name}
        choresCreated: {type: integer}
        completionsImported: {type: integer}
        unassigned: {type: integer, description: Chores whose assignees were all unknown here (now "anyone")}
        webhooksCreated: {type: integer, description: "Webhooks of the file re-created; always disabled, with new signing secrets (an owner rotates the secret to see it, then enables)"}
        webhooksSkipped:
          type: array
          description: Webhooks of the file that were not created; not an error
          items:
            type: object
            properties:
              name: {type: string}
              reason: {type: string, enum: [webhooks_disabled, owner_only, invalid, limit], description: "webhooks switched off on the instance; importer is not an owner; bad URL (scheme, egress rules) or events; the household's webhook limit"}
    HouseholdExport:
      type: object
      required: [format, version, household]
      properties:
        format: {type: string, enum: [gunkly-household-export]}
        version: {type: integer, enum: [1]}
        exportedAt: {type: string, format: date-time}
        household:
          type: object
          required: [name, timezone]
          properties:
            name: {type: string}
            timezone: {type: string}
            quietHours: {type: object, nullable: true, properties: {start: {type: integer}, end: {type: integer}}}
            defaultReminderPreset: {type: string}
            areasEnabled: {type: boolean, description: A new household made from a file with areas turns the feature on}
        areas: {type: array, items: {type: object, properties: {name: {type: string}}}}
        webhooks:
          type: array
          description: Optional, owner exports only (at most 100). URLs can carry credentials. There is no secret field.
          items:
            type: object
            required: [url, events]
            properties:
              name: {type: string, description: The webhook's description}
              events: {type: array, items: {type: string}}
              url: {type: string}
              enabled: {type: boolean, description: Ignored on import (webhooks always arrive disabled)}
        chores:
          type: array
          items:
            type: object
            required: [name, kind, schedule]
            properties:
              name: {type: string}
              notes: {type: string}
              link: {type: string}
              area: {type: string}
              kind: {type: string, enum: [recurring, oneoff]}
              schedule: {type: object}
              dueDate: {type: string, format: date}
              nextDue: {type: string, format: date-time, nullable: true}
              pausedUntil: {type: string, format: date-time, nullable: true}
              pausedIndefinitely: {type: boolean}
              archivedAt: {type: string, format: date-time, nullable: true}
              reminderPreset: {type: string}
              reminders: {type: array, items: {type: object, properties: {kind: {type: string}, days: {type: integer}, minute: {type: integer}}}}
              assignees: {type: array, items: {type: object, properties: {displayName: {type: string}, username: {type: string}}}}
              completions: {type: array, items: {type: object, properties: {completedAt: {type: string, format: date-time}, by: {type: object, nullable: true}, note: {type: string}, source: {type: string}, reverted: {type: boolean}}}}
    UserExport:
      type: object
      properties:
        format: {type: string, enum: [gunkly-user-export]}
        version: {type: integer, enum: [1]}
        exportedAt: {type: string, format: date-time}
        profile: {type: object}
        preferences: {type: object}
        memberships: {type: array, items: {type: object}}
        completions: {type: array, items: {type: object}}
        channels: {type: array, items: {type: object, properties: {kind: {type: string}, label: {type: string}}}}
        sessions: {type: array, items: {type: object}}
        passkeys: {type: array, items: {type: object}, description: "Names and dates only, no key material"}
        audit: {type: array, items: {type: object}}
    Role: {type: string, enum: [owner, member, guest]}
    SetupRequest:
      allOf:
        - $ref: "#/components/schemas/NewAccount"
        - type: object
          required: [code]
          properties: {code: {type: string}}
    NewAccount:
      type: object
      required: [username, password, displayName]
      properties:
        username: {type: string}
        email: {type: string}
        password: {type: string}
        displayName: {type: string}
    Session:
      type: object
      properties:
        authenticated: {type: boolean}
        twoFactorRequired: {type: boolean}
        method: {type: string, enum: [totp, email, passkey], description: "Second factor asked for when twoFactorRequired"}
        passkey: {type: boolean, description: "A passkey can be used as the second factor (send passkey with the same login and password; options from /session/passkey/options)"}
        emailSent: {type: boolean, description: "With method email: the code was emailed by this call. Absent while a passkey is offered first; ask with sendEmailCode"}
        user: {$ref: "#/components/schemas/Me"}
        csrf: {type: string}
    Me:
      type: object
      properties:
        id: {type: string}
        username: {type: string}
        email: {type: string}
        displayName: {type: string}
        locale: {type: string}
        weekStart: {type: integer, nullable: true}
        isAdmin: {type: boolean}
        totpEnabled: {type: boolean}
        emailVerified: {type: boolean}
        emailOtpEnabled: {type: boolean}
        twoFactor: {type: string, enum: ["", totp, email]}
        passkeys: {type: integer, description: "Registered passkeys; each is a sign-in method and a second factor"}
        hasPassword: {type: boolean, description: "False for an account created by single sign-on until it sets a password"}
        ssoLinked: {type: boolean}
        emailReminders: {type: boolean, description: "Reminders are sent by email to the verified address"}
        signinAlerts: {type: boolean, description: "Email about a sign-in from an unusual place (new country or hosting network); default true"}
        quietHours: {type: object, nullable: true, properties: {start: {type: integer}, end: {type: integer}}, description: "Personal quiet hours (in timeZone, or each household's zone when that is null); null = none"}
        timeZone: {type: string, nullable: true, description: "IANA zone the personal quiet hours are read in, and what today means in chore views for this user's sessions (status overdue/today/thisWeek; not for API tokens); null = each household's zone"}
    PasskeyOptions:
      type: object
      properties:
        challenge: {type: string, description: "ID to send back with the browser's answer; single use, valid 5 minutes"}
        options: {type: object, description: "WebAuthn options in JSON form ({publicKey: ...}); binary values are base64url"}
    PasskeyAnswer:
      type: object
      required: [challenge, credential]
      properties:
        challenge: {type: string}
        credential: {type: object, description: "The PublicKeyCredential from navigator.credentials.get in JSON form (binary values base64url)"}
    Passkey:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        createdAt: {type: string, format: date-time}
        lastUsedAt: {type: string, format: date-time, nullable: true}
    PoWChallenge:
      type: object
      properties:
        algorithm: {type: string, enum: [SHA-256]}
        challenge: {type: string, description: "hex SHA-256 of salt followed by the secret number"}
        salt: {type: string, description: "Random; carries the expiry (?expires=unix&)"}
        maxnumber: {type: integer}
        signature: {type: string, description: "hex HMAC-SHA-256 of the challenge"}
    PoWSolution:
      type: object
      properties:
        algorithm: {type: string}
        challenge: {type: string}
        salt: {type: string}
        signature: {type: string}
        number: {type: integer, description: "The number n with SHA-256(salt + n) = challenge"}
    Device:
      type: object
      properties:
        id: {type: string}
        browser: {type: string}
        os: {type: string}
        createdAt: {type: string, format: date-time}
        lastSeenAt: {type: string, format: date-time}
        current: {type: boolean}
    AuditEvent:
      type: object
