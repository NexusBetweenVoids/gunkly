openapi: 3.0.3
info:
  title: Gunkly API
  version: 1.0.0
  description: |
    The versioned JSON API under /api/v1. Browser sessions use the gunkly_session
    cookie; state-changing requests also send the gunkly_csrf cookie value in the
    X-CSRF-Token header. Errors are {"error":{"code":"..."}} with stable codes;
    the server never sends user-facing text. Household routes answer 404 to
    non-members (no existence oracle) and 403 when the role is too low
    (guest < member < owner). Breaking changes to /api/v1 are forbidden.
servers:
  - url: /api/v1
tags:
  - {name: setup}
  - {name: session}
  - {name: account}
  - {name: households}
  - {name: areas}
  - {name: chores}
  - {name: reminders}
  - {name: feeds}
  - {name: channels}
  - {name: push}
  - {name: admin}
paths:
  /setup:
    get:
      tags: [setup]
      summary: Whether first-run setup is pending
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: object, properties: {needed: {type: boolean}}}}}}
    post:
      tags: [setup]
      summary: Create the first admin with the one-time setup code from the server log
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/SetupRequest"}}}}
      responses:
        "201": {description: Admin created and signed in, content: {application/json: {schema: {$ref: "#/components/schemas/Session"}}}}
        "400": {$ref: "#/components/responses/Invalid"}
        "403": {description: Invalid setup code (invalid_setup_code)}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/RateLimited"}
  /session:
    get:
      tags: [session]
      summary: Current session; also issues the CSRF cookie
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Session"}}}}
    post:
      tags: [session]
      summary: Sign in (password, plus TOTP or a recovery code when 2FA is on)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, password]
              properties:
                login: {type: string, description: Username or email}
                password: {type: string}
                totp: {type: string}
                recoveryCode: {type: string}
      responses:
        "200": {description: Signed in, or twoFactorRequired, content: {application/json: {schema: {$ref: "#/components/schemas/Session"}}}}
        "401": {description: invalid_credentials or invalid_code}
        "429": {$ref: "#/components/responses/RateLimited"}
    delete:
      tags: [session]
      summary: Sign out
      responses:
        "204": {description: Signed out}
        "401": {$ref: "#/components/responses/Unauthenticated"}
  /session/step-up:
    post:
      tags: [session]
      summary: Re-verify credentials for sensitive actions (valid 15 minutes)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password: {type: string}
                totp: {type: string}
                recoveryCode: {type: string}
      responses:
        "204": {description: Verified}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "429": {$ref: "#/components/responses/RateLimited"}
  /sessions:
    get:
      tags: [session]
      summary: Signed-in devices
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Device"}}}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
    delete:
      tags: [session]
      summary: Sign out every other device
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: object, properties: {revoked: {type: integer}}}}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
  /sessions/{id}:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}]
    delete:
      tags: [session]
      summary: Sign out one device
      responses:
        "204": {description: Revoked}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404": {$ref: "#/components/responses/NotFound"}
  /me:
    get:
      tags: [account]
      summary: The signed-in user
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Me"}}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
    patch:
      tags: [account]
      summary: Update profile (display name, language, first weekday)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName: {type: string}
                locale: {type: string, description: "BCP 47 tag; empty follows the browser"}
                weekStart: {type: integer, nullable: true, minimum: 0, maximum: 6, description: "0 = Sunday; null = language default"}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Me"}}}}
        "400": {$ref: "#/components/responses/Invalid"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
  /account/password:
    post:
      tags: [account]
      summary: Change password (step-up required)
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [newPassword], properties: {newPassword: {type: string}}}}}}
      responses:
        "204": {description: Changed; other sessions are signed out}
        "400": {$ref: "#/components/responses/Invalid"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/RateLimited"}
  /account/totp/setup:
    post:
      tags: [account]
      summary: Start TOTP enrolment (step-up required)
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: object, properties: {secret: {type: string}, uri: {type: string}}}}}}
        "403": {$ref: "#/components/responses/Forbidden"}
  /account/totp/confirm:
    post:
      tags: [account]
      summary: Confirm TOTP enrolment with a code; returns recovery codes once
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [code], properties: {code: {type: string}}}}}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: object, properties: {recoveryCodes: {type: array, items: {type: string}}}}}}}
        "400": {$ref: "#/components/responses/Invalid"}
        "401": {description: invalid_code}
        "429": {$ref: "#/components/responses/RateLimited"}
  /account/totp:
    delete:
      tags: [account]
      summary: Disable TOTP (step-up required)
      responses:
        "204": {description: Disabled}
        "403": {$ref: "#/components/responses/Forbidden"}
  /account/audit:
    get:
      tags: [account]
      summary: The user's own recent audit events
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/AuditEvent"}}}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
  /account/export:
    get:
      tags: [account]
      summary: Export all of the user's own data as a JSON download (step-up)
      description: |
        Format gunkly-user-export, version 1: profile, preferences, memberships (household names and roles), the user's own
        completions, personal notification channels (kind and label only, never URLs), sessions (device labels, no tokens),
        own audit events. Sent as an attachment. Audited. Rate limit 6/min per IP.
      responses:
        "200": {description: The export file, headers: {Content-Disposition: {schema: {type: string}, description: attachment}}, content: {application/json: {schema: {$ref: "#/components/schemas/UserExport"}}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/RateLimited"}
  /households/{hh}/export:
    parameters: [{$ref: "#/components/parameters/hh"}]
    get:
      tags: [households]
      summary: Export the household as a JSON download (member; guests are refused)
      description: |
        Format gunkly-household-export, version 1: settings, areas, chores (schedule, reminders, pause and archive state,
        assignee display names and usernames as hints) and completion history. Never includes notification channels, feeds,
        tokens, invites or member emails. Audited. Rate limit 6/min per IP.
      responses:
        "200": {description: The export file, headers: {Content-Disposition: {schema: {type: string}, description: attachment}}, content: {application/json: {schema: {$ref: "#/components/schemas/HouseholdExport"}}}}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/RateLimited"}
  /households/import:
    post:
      tags: [households]
      summary: Create a household from an export file (the user becomes owner)
      description: |
        The body is a gunkly-household-export file (up to 5 MiB; every other route accepts 1 MiB). The whole file is
        validated like the normal create paths and applied in one transaction. Rate limit 6/min per IP.
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/HouseholdExport"}}}}
      responses:
        "201": {description: Created, content: {application/json: {schema: {$ref: "#/components/schemas/ImportSummary"}}}}
        "400": {$ref: "#/components/responses/ImportInvalid"}
        "409": {$ref: "#/components/responses/ImportInvalid"}
        "413": {description: Upload larger than 5 MiB (body_too_large)}
        "429": {$ref: "#/components/responses/RateLimited"}
  /households/{hh}/import:
    parameters: [{$ref: "#/components/parameters/hh"}]
    post:
      tags: [households]
      summary: Merge an export file into this household (member)
      description: |
        Areas with the same name (case-insensitive) are combined; chores are added as new chores; assignees are matched to
        members by username (others become "anyone"); completers are matched by username, otherwise the completion is
        anonymous. The household's own settings are never changed. One transaction: all or nothing. Rate limit 6/min per IP.
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/HouseholdExport"}}}}
      responses:
        "200": {description: Merged, content: {application/json: {schema: {$ref: "#/components/schemas/ImportSummary"}}}}
        "400": {$ref: "#/components/responses/ImportInvalid"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/ImportInvalid"}
        "413": {description: Upload larger than 5 MiB (body_too_large)}
        "429": {$ref: "#/components/responses/RateLimited"}
  /templates:
    get:
      tags: [chores]
      summary: Starter chore templates (the editor prefills from these)
      description: Names translate as template.<key>, areas as area.<area> in the front-end catalog.
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Template"}}}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
  /households:
    get:
      tags: [households]
      summary: The user's households
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Household"}}}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
    post:
      tags: [households]
      summary: Create a household (the user becomes owner)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, timezone]
              properties:
                name: {type: string, maxLength: 100}
                timezone: {type: string, description: IANA zone}
                starterAreas: {type: boolean, description: "Also create Kitchen, Bathroom, Garden, Exterior, Appliances and General, named in the user's language"}
      responses:
        "201": {description: Created, content: {application/json: {schema: {$ref: "#/components/schemas/Household"}}}}
        "400": {$ref: "#/components/responses/Invalid"}
        "409": {$ref: "#/components/responses/LimitReached"}
  /households/{hh}:
    parameters: [{$ref: "#/components/parameters/hh"}]
    get:
      tags: [households]
      summary: Household details (guest)
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Household"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
    patch:
      tags: [households]
      summary: Update settings (owner)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string}
                timezone: {type: string}
                quietHours: {type: object, nullable: true, properties: {start: {type: integer}, end: {type: integer}}}
                defaultReminderPreset: {type: string, enum: ["", gentle, nag, none]}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Household"}}}}
        "400": {$ref: "#/components/responses/Invalid"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /households/{hh}/members:
    parameters: [{$ref: "#/components/parameters/hh"}]
    get:
      tags: [households]
      summary: Members (guest)
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Member"}}}}}
        "404": {$ref: "#/components/responses/NotFound"}
  /households/{hh}/members/{user}:
    parameters: [{$ref: "#/components/parameters/hh"}, {name: user, in: path, required: true, schema: {type: string}}]
    patch:
      tags: [households]
      summary: Change a member's role (owner)
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [role], properties: {role: {$ref: "#/components/schemas/Role"}}}}}}
      responses:
        "204": {description: Changed}
        "400": {$ref: "#/components/responses/Invalid"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      tags: [households]
      summary: Remove a member (owner) or leave (self)
      responses:
        "204": {description: Removed}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /households/{hh}/invites:
    parameters: [{$ref: "#/components/parameters/hh"}]
    get:
      tags: [households]
      summary: Active invite links (owner)
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Invite"}}}}}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    post:
      tags: [households]
      summary: Create an invite link (owner); the token is returned once
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: {type: string, enum: [member, guest]}
                expiresInHours: {type: integer, minimum: 1, maximum: 720}
                maxUses: {type: integer, minimum: 1, maximum: 100, default: 1, description: How many people may join with the link}
      responses:
        "201": {description: Created, content: {application/json: {schema: {$ref: "#/components/schemas/Invite"}}}}
        "400": {$ref: "#/components/responses/Invalid"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/LimitReached"}
  /households/{hh}/invites/{invite}:
    parameters: [{$ref: "#/components/parameters/hh"}, {name: invite, in: path, required: true, schema: {type: string}}]
    delete:
      tags: [households]
      summary: Revoke an invite (owner)
      responses:
        "204": {description: Revoked}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /invites/{token}/accept:
    parameters: [{name: token, in: path, required: true, schema: {type: string}}]
    post:
      tags: [households]
      summary: Join a household with an invite link (signed in)
      responses:
        "200": {description: Joined, content: {application/json: {schema: {$ref: "#/components/schemas/Joined"}}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/LimitReached"}
        "429": {$ref: "#/components/responses/RateLimited"}
  /invites/{token}/register:
    parameters: [{name: token, in: path, required: true, schema: {type: string}}]
    post:
      tags: [households]
      summary: Create an account and join with an invite link
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/NewAccount"}}}}
      responses:
        "201": {description: Registered and signed in, content: {application/json: {schema: {$ref: "#/components/schemas/Session"}}}}
        "400": {$ref: "#/components/responses/Invalid"}
        "403": {description: registration_disabled}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/RateLimited"}
  /households/{hh}/areas:
    parameters: [{$ref: "#/components/parameters/hh"}]
    get:
      tags: [areas]
      summary: Areas by name (guest)
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Area"}}}}}
        "404": {$ref: "#/components/responses/NotFound"}
    post:
      tags: [areas]
      summary: Create an area (member)
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/AreaInput"}}}}
      responses:
        "201": {description: Created, content: {application/json: {schema: {$ref: "#/components/schemas/Area"}}}}
        "400": {$ref: "#/components/responses/Invalid"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {description: An area with that name exists (conflict)}
  /households/{hh}/areas/{area}:
    parameters: [{$ref: "#/components/parameters/hh"}, {name: area, in: path, required: true, schema: {type: string}}]
    patch:
      tags: [areas]
      summary: Rename an area (member)
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/AreaInput"}}}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Area"}}}}
        "400": {$ref: "#/components/responses/Invalid"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {description: An area with that name exists (conflict)}
    delete:
      tags: [areas]
      summary: Delete an area; its chores become area-less (member)
      responses:
        "204": {description: Deleted}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /households/{hh}/chores:
    parameters: [{$ref: "#/components/parameters/hh"}]
    get:
      tags: [chores]
      summary: Chores with computed due status (guest)
      description: Ordered by due time. status is relative to today in the household zone and the user's week start.
      parameters:
        - {name: mine, in: query, schema: {type: string, enum: ["1"]}, description: Assigned to me or to anyone}
        - {name: area, in: query, schema: {type: string}, description: Area ID}
        - {name: archived, in: query, schema: {type: string, enum: ["1"]}, description: List archived chores instead of active ones}
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Chore"}}}}}
        "404": {$ref: "#/components/responses/NotFound"}
    post:
      tags: [chores]
      summary: Create a chore (member)
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/ChoreInput"}}}}
      responses:
        "201": {description: Created, content: {application/json: {schema: {$ref: "#/components/schemas/Chore"}}}}
        "400": {$ref: "#/components/responses/Invalid"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/LimitReached"}
  /households/{hh}/chores/{chore}:
    parameters: [{$ref: "#/components/parameters/hh"}, {$ref: "#/components/parameters/chore"}]
    get:
      tags: [chores]
      summary: One chore (guest)
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Chore"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
    put:
      tags: [chores]
      summary: Replace the editable fields (member); simple and advanced editors share this
      description: The current occurrence is kept unless schedule.firstDue or kind changes. Pause state and a custom reminder preset are kept.
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/ChoreInput"}}}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Chore"}}}}
        "400": {$ref: "#/components/responses/Invalid"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      tags: [chores]
      summary: Delete a chore and its history (member); audited
      responses:
        "204": {description: Deleted}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /households/{hh}/chores/{chore}/archive:
    parameters: [{$ref: "#/components/parameters/hh"}, {$ref: "#/components/parameters/chore"}]
    post:
      tags: [chores]
      summary: Archive (keeps history, stops reminders; member)
      responses:
        "204": {description: Archived}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /households/{hh}/chores/{chore}/unarchive:
    parameters: [{$ref: "#/components/parameters/hh"}, {$ref: "#/components/parameters/chore"}]
    post:
      tags: [chores]
      summary: Unarchive (member)
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Chore"}}}}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /households/{hh}/chores/{chore}/complete:
    parameters: [{$ref: "#/components/parameters/hh"}, {$ref: "#/components/parameters/chore"}]
    post:
      tags: [chores]
      summary: Mark done from the app (member)
      description: Advances a recurring chore to its next occurrence; a one-off chore is archived. undoPath is the revert endpoint for this completion.
      requestBody:
        required: false
        content: {application/json: {schema: {type: object, properties: {note: {type: string, maxLength: 2000}}}}}
      responses:
        "201":
          description: Completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  completion: {$ref: "#/components/schemas/Completion"}
                  chore: {$ref: "#/components/schemas/Chore"}
                  undoPath: {type: string}
        "400": {$ref: "#/components/responses/Invalid"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {description: Chore is archived (conflict)}
  /households/{hh}/chores/{chore}/completions:
    parameters: [{$ref: "#/components/parameters/hh"}, {$ref: "#/components/parameters/chore"}]
    get:
      tags: [chores]
      summary: Completion history, newest first (guest)
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
        - {name: after, in: query, schema: {type: string}, description: The next value of the previous page}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/Completion"}}
                  next: {type: string, description: Cursor for the next page; empty on the last}
        "400": {$ref: "#/components/responses/Invalid"}
        "404": {$ref: "#/components/responses/NotFound"}
  /households/{hh}/chores/{chore}/completions/{completion}/revert:
    parameters: [{$ref: "#/components/parameters/hh"}, {$ref: "#/components/parameters/chore"}, {name: completion, in: path, required: true, schema: {type: string}}]
    post:
      tags: [chores]
      summary: Revert a completion (member); restores the previous due date; audited
      responses:
        "200": {description: The chore afterwards, content: {application/json: {schema: {$ref: "#/components/schemas/Chore"}}}}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {description: Already reverted (conflict)}
  /households/{hh}/chores/{chore}/snooze:
    parameters: [{$ref: "#/components/parameters/hh"}, {$ref: "#/components/parameters/chore"}]
    post:
      tags: [chores]
      summary: Move this occurrence to a date (member); invalidates mark-done links
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [until], properties: {until: {type: string, format: date, description: "Local date, today or later"}}}}}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Chore"}}}}
        "400": {$ref: "#/components/responses/Invalid"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {description: Chore is archived (conflict)}
  /households/{hh}/chores/{chore}/skip:
    parameters: [{$ref: "#/components/parameters/hh"}, {$ref: "#/components/parameters/chore"}]
    post:
      tags: [chores]
      summary: Skip once - advance to the next occurrence without a completion (member); audited
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Chore"}}}}
        "400": {description: One-off chores do not repeat (invalid), content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {description: Archived, or no further occurrence (conflict, no_next_occurrence)}
  /households/{hh}/chores/{chore}/pause:
    parameters: [{$ref: "#/components/parameters/hh"}, {$ref: "#/components/parameters/chore"}]
    post:
      tags: [chores]
      summary: Pause until a date, or indefinitely without one (member)
      requestBody:
        required: false
        content: {application/json: {schema: {type: object, properties: {until: {type: string, format: date, description: "Local date after today"}}}}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Chore"}}}}
        "400": {$ref: "#/components/responses/Invalid"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {description: Chore is archived (conflict)}
  /households/{hh}/chores/{chore}/resume:
    parameters: [{$ref: "#/components/parameters/hh"}, {$ref: "#/components/parameters/chore"}]
    post:
      tags: [chores]
      summary: Resume a paused chore (member)
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Chore"}}}}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {description: Chore is archived (conflict)}
  /households/{hh}/chores/{chore}/reminders:
    parameters: [{$ref: "#/components/parameters/hh"}, {$ref: "#/components/parameters/chore"}]
    get:
      tags: [reminders]
      summary: The chore's reminder setup (guest)
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/RemindersView"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
    put:
      tags: [reminders]
      summary: Replace the reminder setup (member)
      description: Send a preset ("" = household default, gentle, nag, none) or a reminders list (custom; at most the household's reminders-per-chore limit).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                preset: {type: string, enum: ["", gentle, nag, none, custom]}
                reminders: {type: array, items: {$ref: "#/components/schemas/Reminder"}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/RemindersView"}}}}
        "400": {$ref: "#/components/responses/Invalid"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/LimitReached"}
  /households/{hh}/chores/{chore}/mute:
    parameters: [{$ref: "#/components/parameters/hh"}, {$ref: "#/components/parameters/chore"}]
    put:
      tags: [reminders]
      summary: Mute this chore's reminders for me (member)
      responses:
        "204": {description: Muted}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      tags: [reminders]
      summary: Unmute (member)
      responses:
        "204": {description: Unmuted}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /households/{hh}/reminder-presets:
    parameters: [{$ref: "#/components/parameters/hh"}]
    get:
      tags: [reminders]
      summary: Built-in reminder presets and the household default (guest)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  default: {type: string}
                  presets:
                    type: array
                    items:
                      type: object
                      properties:
                        name: {type: string}
                        reminders: {type: array, items: {$ref: "#/components/schemas/Reminder"}}
        "404": {$ref: "#/components/responses/NotFound"}
  /households/{hh}/calendar:
    parameters: [{$ref: "#/components/parameters/hh"}]
    get:
      tags: [chores]
      summary: Occurrences per chore in a date range (guest)
      description: Calendar-rule (from-scheduled) chores list every occurrence; one-off and from-completion chores only their next due date. At most 62 days inclusive.
      parameters:
        - {name: from, in: query, required: true, schema: {type: string, format: date}}
        - {name: to, in: query, required: true, schema: {type: string, format: date}}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  from: {type: string, format: date}
                  to: {type: string, format: date}
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        choreId: {type: string}
                        name: {type: string}
                        areaId: {type: string, nullable: true}
                        dates: {type: array, items: {type: string, format: date}}
        "400": {$ref: "#/components/responses/Invalid"}
        "404": {$ref: "#/components/responses/NotFound"}
  /households/{hh}/feeds:
    parameters: [{$ref: "#/components/parameters/hh"}]
    get:
      tags: [feeds]
      summary: The caller's calendar feeds for the household (guest)
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Feed"}}}}}
        "404": {$ref: "#/components/responses/NotFound"}
    post:
      tags: [feeds]
      summary: Create a read-only iCal feed (guest); the URL is shown once
      responses:
        "201": {description: Created, content: {application/json: {schema: {$ref: "#/components/schemas/FeedCreated"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/LimitReached"}
  /households/{hh}/feeds/{id}:
    parameters: [{$ref: "#/components/parameters/hh"}, {$ref: "#/components/parameters/id"}]
    delete:
      tags: [feeds]
      summary: Revoke a feed (guest, own feeds)
      responses:
        "204": {description: Revoked}
        "404": {$ref: "#/components/responses/NotFound"}
  /households/{hh}/feeds/{id}/regenerate:
    parameters: [{$ref: "#/components/parameters/hh"}, {$ref: "#/components/parameters/id"}]
    post:
      tags: [feeds]
      summary: Replace a feed's secret URL (guest, own feeds); the new URL is shown once
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: object, properties: {id: {type: string}, url: {type: string}}}}}}
        "404": {$ref: "#/components/responses/NotFound"}
  /notification-kinds:
    get:
      tags: [channels]
      summary: Notification services enabled on this instance (signed in)
      description: What users may add channels for. Sorted. Admins change it with PATCH /admin/settings.
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: object, properties: {enabledNotificationKinds: {type: array, items: {type: string}}}}}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
  /account/channels:
    get:
      tags: [channels]
      summary: The caller's personal notification channels
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Channel"}}}}}
    post:
      tags: [channels]
      summary: Add a personal notification channel (the URL is write-only)
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/ChannelInput"}}}}
      responses:
        "201": {description: Created, content: {application/json: {schema: {$ref: "#/components/schemas/Channel"}}}}
        "400": {$ref: "#/components/responses/ChannelInvalid"}
        "409": {$ref: "#/components/responses/LimitReached"}
  /account/channels/{id}:
    parameters: [{$ref: "#/components/parameters/id"}]
    patch:
      tags: [channels]
      summary: Rename a channel or replace its URL
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/ChannelPatch"}}}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Channel"}}}}
        "400": {$ref: "#/components/responses/ChannelInvalid"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      tags: [channels]
      summary: Delete a channel
      responses:
        "204": {description: Deleted}
        "404": {$ref: "#/components/responses/NotFound"}
  /push/vapid-public-key:
    get:
      tags: [push]
      summary: The VAPID public key a browser subscribes to Web Push with (signed in)
      description: Generated on first use; the private half is stored encrypted. Base64url, uncompressed P-256 point (applicationServerKey).
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: object, properties: {publicKey: {type: string}}}}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
  /account/push-subscriptions:
    get:
      tags: [push]
      summary: The caller's browser push subscriptions
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/PushSubscription"}}}}}
    post:
      tags: [push]
      summary: Register this browser for Web Push reminders
      description: |
        Body is the browser's PushSubscription.toJSON() (endpoint and keys). The endpoint must be a known push
        service (fcm.googleapis.com, web.push.apple.com, updates.push.services.mozilla.com, *.notify.windows.com;
        https, port 443). An endpoint that is already registered is replaced, so reminders follow whoever is
        signed in in that browser. The endpoint and keys are never returned.
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/PushSubscriptionInput"}}}}
      responses:
        "201": {description: Created, content: {application/json: {schema: {$ref: "#/components/schemas/PushSubscription"}}}}
        "400": {description: "Invalid input (invalid_json, invalid_push_endpoint, invalid_push_keys)", content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "409": {$ref: "#/components/responses/LimitReached"}
  /account/push-subscriptions/{id}:
    parameters: [{$ref: "#/components/parameters/id"}]
    delete:
      tags: [push]
      summary: Remove a push subscription
      responses:
        "204": {description: Deleted}
        "404": {$ref: "#/components/responses/NotFound"}
  /account/channels/{id}/test:
    parameters: [{$ref: "#/components/parameters/id"}]
    post:
      tags: [channels]
      summary: Send a test message and log it
      responses:
        "200": {$ref: "#/components/responses/TestResult"}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/RateLimited"}
  /households/{hh}/channels:
    parameters: [{$ref: "#/components/parameters/hh"}]
    get:
      tags: [channels]
      summary: Household notification channels (member)
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Channel"}}}}}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    post:
      tags: [channels]
      summary: Add a household notification channel (member)
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/ChannelInput"}}}}
      responses:
        "201": {description: Created, content: {application/json: {schema: {$ref: "#/components/schemas/Channel"}}}}
        "400": {$ref: "#/components/responses/ChannelInvalid"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/LimitReached"}
  /households/{hh}/channels/{id}:
    parameters: [{$ref: "#/components/parameters/hh"}, {$ref: "#/components/parameters/id"}]
    patch:
      tags: [channels]
      summary: Rename a household channel or replace its URL (member)
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/ChannelPatch"}}}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Channel"}}}}
        "400": {$ref: "#/components/responses/ChannelInvalid"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      tags: [channels]
      summary: Delete a household channel (member)
      responses:
        "204": {description: Deleted}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /households/{hh}/channels/{id}/test:
    parameters: [{$ref: "#/components/parameters/hh"}, {$ref: "#/components/parameters/id"}]
    post:
      tags: [channels]
      summary: Send a test message through a household channel and log it (member)
      responses:
        "200": {$ref: "#/components/responses/TestResult"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/RateLimited"}
  /account/deliveries:
    get:
      tags: [channels]
      summary: Delivery log of the caller's personal channels, newest first
      parameters: [{$ref: "#/components/parameters/limit"}, {$ref: "#/components/parameters/before"}]
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/DeliveryList"}}}}
        "400": {$ref: "#/components/responses/Invalid"}
  /households/{hh}/deliveries:
    parameters: [{$ref: "#/components/parameters/hh"}]
    get:
      tags: [channels]
      summary: Delivery log of the household's channels, newest first (member)
      parameters: [{$ref: "#/components/parameters/limit"}, {$ref: "#/components/parameters/before"}]
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/DeliveryList"}}}}
        "400": {$ref: "#/components/responses/Invalid"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /admin/users:
    get:
      tags: [admin]
      summary: All accounts (admin)
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/AdminUser"}}}}}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      tags: [admin]
      summary: Create an account (admin, step-up)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/NewAccount"
                - type: object
                  properties: {isAdmin: {type: boolean}}
      responses:
        "201": {description: Created, content: {application/json: {schema: {$ref: "#/components/schemas/AdminUser"}}}}
        "400": {$ref: "#/components/responses/Invalid"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {description: Username or email taken (conflict)}
  /admin/users/{id}/reset-password:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}]
    post:
      tags: [admin]
      summary: Set a new random password for a non-admin account (admin, step-up); returned once
      description: Disabled in hosted mode (403 disabled_in_hosted_mode) and refused for admin accounts (403 admin_target). The reset is written to the target's own audit log and signs them out everywhere.
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: object, properties: {password: {type: string}}}}}}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /admin/updates:
    get:
      tags: [admin]
      summary: Running version and the latest release (admin)
      description: |
        Reads the cached result of the background release check, which asks the GitHub Releases API at most
        every 12 hours with the User-Agent "gunkly-update-check" and no instance data. It never makes a request
        itself. With updateCheck off, nothing is shown (enabled false). changelog is plain text: show it as
        text, never as HTML.
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Updates"}}}}
        "403": {$ref: "#/components/responses/Forbidden"}
  /admin/settings:
    get:
      tags: [admin]
      summary: Instance settings and effective limits (admin)
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/AdminSettings"}}}}
        "403": {$ref: "#/components/responses/Forbidden"}
    patch:
      tags: [admin]
      summary: Update instance settings (admin, step-up)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                openSignup: {type: boolean}
                inviteRegistration: {type: boolean}
                minPasswordLength: {type: integer, minimum: 8, maximum: 128}
                sessionIdleDays: {type: integer, minimum: 1, maximum: 365, description: "Sign out after this many days without use (default 30); must not exceed sessionMaxDays"}
                sessionMaxDays: {type: integer, minimum: 1, maximum: 730, description: "Absolute session lifetime in days from sign-in (default 90)"}
                auditRetentionDays: {type: integer, minimum: 1, maximum: 3650, description: "Audit log entries older than this are deleted daily (default 90)"}
                deliveryRetentionDays: {type: integer, minimum: 1, maximum: 3650, description: "Delivery log entries older than this are deleted daily (default 30)"}
                limits: {type: object, additionalProperties: {type: integer}, description: "0 resets a limit to its default"}
                enabledNotificationKinds: {type: array, items: {type: string}, description: "Allowed notification services; must be a subset of availableNotificationKinds"}
                egressGuard: {type: boolean, description: "Block outbound requests to private addresses; rejected while egressGuardLocked"}
                updateCheck: {type: boolean, description: "Check for new releases in the background (default true)"}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/AdminSettings"}}}}
        "400": {$ref: "#/components/responses/Invalid"}
        "403": {$ref: "#/components/responses/Forbidden"}
components:
  parameters:
    hh: {name: hh, in: path, required: true, schema: {type: string}, description: Household ID}
    chore: {name: chore, in: path, required: true, schema: {type: string}, description: Chore ID}
    id: {name: id, in: path, required: true, schema: {type: string}}
    limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
    before: {name: before, in: query, schema: {type: string}, description: Opaque cursor from a previous page's next}
  responses:
    ChannelInvalid: {description: Invalid input (invalid, invalid_json, invalid_channel_url, service_disabled), content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
    TestResult:
      description: Test outcome; error text is redacted
      content: {application/json: {schema: {type: object, properties: {sent: {type: boolean}, error: {type: string}}}}}
    Invalid: {description: Validation failed (invalid, invalid_json), content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
    Unauthenticated: {description: Not signed in (unauthenticated), content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
    Forbidden: {description: Role too low, CSRF failure or step-up needed (forbidden, csrf_failed, step_up_required), content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
    NotFound: {description: Not found, or not a member of the household (not_found), content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
    ImportInvalid:
      description: The file was rejected (code import_invalid; limit_reached when the household is already full)
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  code: {type: string, enum: [import_invalid, limit_reached]}
                  reason: {type: string, enum: [not_json, format, version, required, invalid, too_long, limit_chores, limit_areas, limit_reminders, limit_completions]}
                  path: {type: string, description: "Offending field, e.g. chores[3].schedule.rrule"}
    LimitReached: {description: A usage limit was reached (limit_reached), content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
    RateLimited: {description: Too many attempts (rate_limited), headers: {Retry-After: {schema: {type: integer}}}, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  schemas:
    Error:
      type: object
      properties:
        error: {type: object, properties: {code: {type: string}}}
    ImportSummary:
      type: object
      properties:
        household: {type: object, properties: {id: {type: string}, name: {type: string}}}
        areasCreated: {type: integer}
        areasMerged: {type: integer, description: File areas that matched an existing area by name}
        choresCreated: {type: integer}
        completionsImported: {type: integer}
        unassigned: {type: integer, description: Chores whose assignees were all unknown here (now "anyone")}
    HouseholdExport:
      type: object
      required: [format, version, household]
      properties:
        format: {type: string, enum: [gunkly-household-export]}
        version: {type: integer, enum: [1]}
        exportedAt: {type: string, format: date-time}
        household:
          type: object
          required: [name, timezone]
          properties:
            name: {type: string}
            timezone: {type: string}
            quietHours: {type: object, nullable: true, properties: {start: {type: integer}, end: {type: integer}}}
            defaultReminderPreset: {type: string}
        areas: {type: array, items: {type: object, properties: {name: {type: string}}}}
        chores:
          type: array
          items:
            type: object
            required: [name, kind, schedule]
            properties:
              name: {type: string}
              notes: {type: string}
              link: {type: string}
              area: {type: string}
              kind: {type: string, enum: [recurring, oneoff]}
              schedule: {type: object}
              dueDate: {type: string, format: date}
              nextDue: {type: string, format: date-time, nullable: true}
              pausedUntil: {type: string, format: date-time, nullable: true}
              pausedIndefinitely: {type: boolean}
              archivedAt: {type: string, format: date-time, nullable: true}
              reminderPreset: {type: string}
              reminders: {type: array, items: {type: object, properties: {kind: {type: string}, days: {type: integer}, minute: {type: integer}}}}
              assignees: {type: array, items: {type: object, properties: {displayName: {type: string}, username: {type: string}}}}
              completions: {type: array, items: {type: object, properties: {completedAt: {type: string, format: date-time}, by: {type: object, nullable: true}, note: {type: string}, source: {type: string}, reverted: {type: boolean}}}}
    UserExport:
      type: object
      properties:
        format: {type: string, enum: [gunkly-user-export]}
        version: {type: integer, enum: [1]}
        exportedAt: {type: string, format: date-time}
        profile: {type: object}
        preferences: {type: object}
        memberships: {type: array, items: {type: object}}
        completions: {type: array, items: {type: object}}
        channels: {type: array, items: {type: object, properties: {kind: {type: string}, label: {type: string}}}}
        sessions: {type: array, items: {type: object}}
        audit: {type: array, items: {type: object}}
    Role: {type: string, enum: [owner, member, guest]}
    SetupRequest:
      allOf:
        - $ref: "#/components/schemas/NewAccount"
        - type: object
          required: [code]
          properties: {code: {type: string}}
    NewAccount:
      type: object
      required: [username, password, displayName]
      properties:
        username: {type: string}
        email: {type: string}
        password: {type: string}
        displayName: {type: string}
    Session:
      type: object
      properties:
        authenticated: {type: boolean}
        twoFactorRequired: {type: boolean}
        user: {$ref: "#/components/schemas/Me"}
        csrf: {type: string}
    Me:
      type: object
      properties:
        id: {type: string}
        username: {type: string}
        email: {type: string}
        displayName: {type: string}
        locale: {type: string}
        weekStart: {type: integer, nullable: true}
        isAdmin: {type: boolean}
        totpEnabled: {type: boolean}
    Device:
      type: object
      properties:
        id: {type: string}
        browser: {type: string}
        os: {type: string}
        createdAt: {type: string, format: date-time}
        lastSeenAt: {type: string, format: date-time}
        current: {type: boolean}
    AuditEvent:
      type: object
      properties:
        event: {type: string}
        householdId: {type: string}
        ip: {type: string}
        meta: {type: object, additionalProperties: {type: string}}
        createdAt: {type: string, format: date-time}
    Household:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        timezone: {type: string}
        quietHours: {type: object, nullable: true, properties: {start: {type: integer}, end: {type: integer}}}
        defaultReminderPreset: {type: string}
        role: {$ref: "#/components/schemas/Role"}
        createdAt: {type: string, format: date-time}
    Member:
      type: object
      properties:
        userId: {type: string}
        displayName: {type: string}
        role: {$ref: "#/components/schemas/Role"}
        joinedAt: {type: string, format: date-time}
    Invite:
      type: object
      properties:
        id: {type: string}
        role: {$ref: "#/components/schemas/Role"}
        createdBy: {type: string}
        createdAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
        maxUses: {type: integer}
        uses: {type: integer}
        token: {type: string, description: Only in the create response}
        url: {type: string, description: Only in the create response, when a base URL is configured}
    Joined:
      type: object
      properties:
        householdId: {type: string}
        role: {$ref: "#/components/schemas/Role"}
    AdminUser:
      type: object
      properties:
        id: {type: string}
        username: {type: string}
        email: {type: string}
        displayName: {type: string}
        isAdmin: {type: boolean}
        totpEnabled: {type: boolean}
        createdAt: {type: string, format: date-time}
        lastActiveAt: {type: string, format: date-time}
    Feed:
      type: object
      properties:
        id: {type: string}
        createdAt: {type: string, format: date-time}
    FeedCreated:
      allOf:
        - $ref: "#/components/schemas/Feed"
        - type: object
          properties: {url: {type: string, description: "Secret iCal URL, shown once; relative when BASE_URL is unset"}}
    Channel:
      type: object
      description: The channel URL is a secret and is never returned.
      properties:
        id: {type: string}
        scope: {type: string, enum: [user, household]}
        kind: {type: string, description: Notification service kind}
        label: {type: string}
        hint: {type: string, description: Masked tail of the URL}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    ChannelInput:
      type: object
      required: [url]
      properties:
        url: {type: string, description: Write-only service URL}
        label: {type: string}
    ChannelPatch:
      type: object
      properties:
        url: {type: string, description: Write-only; replaces the URL}
        label: {type: string}
    Delivery:
      type: object
      properties:
        id: {type: string}
        type: {type: string, enum: [before, on_due, overdue, test]}
        choreId: {type: string}
        choreName: {type: string}
        channelId: {type: string}
        channelLabel: {type: string}
        kind: {type: string}
        status: {type: string}
        attempts: {type: integer}
        error: {type: string, description: Redacted}
        createdAt: {type: string, format: date-time}
        sentAt: {type: string, format: date-time}
        nextAttemptAt: {type: string, format: date-time}
    DeliveryList:
      type: object
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/Delivery"}}
        next: {type: string, description: Pass as before for the next page; absent on the last page}
    AdminSettings:
      type: object
      properties:
        openSignup: {type: boolean}
        inviteRegistration: {type: boolean}
        minPasswordLength: {type: integer}
        sessionIdleDays: {type: integer}
        sessionMaxDays: {type: integer}
        auditRetentionDays: {type: integer}
        deliveryRetentionDays: {type: integer}
        limits: {type: object, additionalProperties: {type: integer}}
        limitDefaults: {type: object, additionalProperties: {type: integer}}
        enabledNotificationKinds: {type: array, items: {type: string}}
        availableNotificationKinds: {type: array, items: {type: string}}
        egressGuard: {type: boolean}
        egressGuardLocked: {type: boolean, description: "Hosted mode: the guard cannot be turned off"}
        updateCheck: {type: boolean}
    Updates:
      type: object
      properties:
        running: {type: string, description: "Version of this server (dev for development builds)"}
        latest: {type: string, description: "Latest release tag; empty if never checked or the check is off"}
        newer: {type: boolean, description: "latest is newer than running"}
        changelog: {type: string, description: "Release notes, plain text, at most 8000 characters"}
        checkedAt: {type: string, format: date-time, nullable: true}
        enabled: {type: boolean, description: "The updateCheck setting"}
    PushSubscription:
      type: object
      properties:
        id: {type: string}
        endpointHash: {type: string, description: "Hex SHA-256 of the endpoint; a device compares it with its own to find its entry"}
        userAgent: {type: string}
        createdAt: {type: string, format: date-time}
        lastUsedAt: {type: string, format: date-time}
    PushSubscriptionInput:
      type: object
      required: [endpoint, keys]
      properties:
        endpoint: {type: string}
        keys:
          type: object
          required: [p256dh, auth]
          properties:
            p256dh: {type: string, description: "Base64url, 65-byte P-256 public key"}
            auth: {type: string, description: "Base64url, 16 bytes"}
    Area:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        createdAt: {type: string, format: date-time}
    AreaInput:
      type: object
      required: [name]
      properties: {name: {type: string, maxLength: 200}}
    Template:
      type: object
      properties:
        key: {type: string}
        area: {type: string, description: "Suggested starter area key"}
        interval: {$ref: "#/components/schemas/Interval"}
    Interval:
      type: object
      properties:
        every: {type: integer, minimum: 1, maximum: 1000}
        unit: {type: string, enum: [day, week, month]}
    Schedule:
      type: object
      required: [firstDue]
      description: |
        type interval (with interval) or rrule (supported RRULE subset, ADR 0005).
        anchor defaults to from_completion for intervals and from_scheduled for rules.
        firstDue is a local date; for rules the first occurrence on or after it is the first due date.
        One-off chores send only firstDue.
      properties:
        type: {type: string, enum: [interval, rrule]}
        interval: {$ref: "#/components/schemas/Interval"}
        rrule: {type: string}
        anchor: {type: string, enum: [from_completion, from_scheduled]}
        firstDue: {type: string, format: date}
    ChoreInput:
      type: object
      required: [name, schedule]
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        notes: {type: string, maxLength: 10000}
        link: {type: string, description: http or https URL}
        areaId: {type: string, nullable: true}
        kind: {type: string, enum: [recurring, oneoff], default: recurring}
        schedule: {$ref: "#/components/schemas/Schedule"}
        assignees: {type: array, items: {type: string}, description: Non-guest member user IDs; empty = anyone}
        reminderPreset: {type: string, enum: ["", gentle, nag, none], description: Omitted on update keeps the current one}
    Chore:
      type: object
      properties:
        id: {type: string}
        areaId: {type: string, nullable: true}
        name: {type: string}
        notes: {type: string}
        link: {type: string}
        kind: {type: string, enum: [recurring, oneoff]}
        schedule: {$ref: "#/components/schemas/Schedule"}
        dueDate: {type: string, format: date, description: Local date of the current occurrence}
        nextDue: {type: string, format: date-time, nullable: true}
        status: {type: string, enum: [overdue, today, thisWeek, later, none, paused, archived]}
        pausedUntil: {type: string, format: date-time, nullable: true}
        pausedIndefinitely: {type: boolean}
        archivedAt: {type: string, format: date-time, nullable: true}
        reminderPreset: {type: string, description: '"" = household default, custom = own reminders'}
        assignees: {type: array, items: {type: string}}
        muted: {type: boolean, description: Muted by the caller}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    Completion:
      type: object
      properties:
        id: {type: string}
        choreId: {type: string}
        userId: {type: string, nullable: true}
        completedAt: {type: string, format: date-time}
        source: {type: string, enum: [app, mark_done_link, api_token]}
        note: {type: string}
        revertedAt: {type: string, format: date-time, nullable: true}
    Reminder:
      type: object
      required: [kind, minute]
      properties:
        kind: {type: string, enum: [before, "on", overdue]}
        days: {type: integer, minimum: 1, maximum: 365, description: "Before: days ahead. Overdue: repeat every N days (at least 1). Ignored for on."}
        minute: {type: integer, minimum: 0, maximum: 1439, description: Local time of day in minutes after midnight}
    RemindersView:
      type: object
      properties:
        preset: {type: string}
        effectivePreset: {type: string}
        reminders: {type: array, items: {$ref: "#/components/schemas/Reminder"}}
x-outside-api-v1:
  description: |
    Session-less, token-addressed endpoints served outside /api/v1 (hence
    not under paths:). Tokens are secrets; every failure answers one generic
    page or 404.
  routes:
    "GET /done/{token}": Confirmation page for a mark-done link (HTML, no side effects). Rate limit 30/min per IP.
    "POST /done/{token}": Completes the occurrence the link addresses and shows an undo form (HTML form post, CSRF-checked by Origin/Sec-Fetch-Site). Rate limit 30/min per IP.
    "POST /done/undo/{token}": Reverts that completion within 5 minutes (HTML). Rate limit 30/min per IP.
    "GET /done.css": Stylesheet of the mark-done pages.
    "GET /ical/{file}": Read-only iCalendar feed; {file} is "<token>.ics". Rate limit 60/min per IP.
    "GET /metrics": |
      Prometheus text exposition (format 0.0.4). Registered only when GUNKLY_METRICS_TOKEN is set; requires
      "Authorization: Bearer <token>" (constant-time compare, otherwise 401). Rate limit 30/min per IP. Series:
      gunkly_build_info{version}, process_start_time_seconds, go_goroutines, go_memstats_alloc_bytes,
      gunkly_http_requests_total{route,code} (route pattern, status class), gunkly_http_request_duration_seconds
      (histogram), gunkly_deliveries_total{kind,result}, gunkly_scheduler_last_tick_age_seconds,
      gunkly_delivery_queue_depth, gunkly_db_open_connections. No per-user or per-household labels.
