# Gunkly with SQLite (default). Usage:
#   cp .env.example .env   # set GUNKLY_SECRET_KEYS and GUNKLY_BASE_URL
#   docker compose -f compose.sqlite.yml up -d
name: gunkly

services:
  gunkly:
    # Production: pin a version tag or digest (e.g. :1.2.3 or @sha256:...) instead of :latest
    image: ghcr.io/nexusbetweenvoids/gunkly:${IMAGE_TAG:-latest}
    # Gunkly drains requests and sends for up to 30 s on shutdown (GUNKLY_SHUTDOWN_TIMEOUT).
    stop_grace_period: 40s
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      GUNKLY_DATABASE_URL: sqlite:///data/gunkly.db
      SQLITE_TMPDIR: /data/tmp
    ports:
      - "4865:4865"
    volumes:
      - gunkly-data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

volumes:
  gunkly-data:
