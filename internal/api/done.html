<!doctype html>
<html lang="{{.Lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>{{.Title}}</title>
<link rel="stylesheet" href="{{.Base}}/done.css">
</head>
<body>
<main>
<picture><source srcset="{{.Base}}/icons/mark-dark.png" media="(prefers-color-scheme: dark)"><img class="mark" src="{{.Base}}/icons/mark-light.png" alt="" width="72" height="72"></picture>
<h1>{{.Heading}}</h1>
{{if .Note}}<p>{{.Note}}</p>{{end}}
{{if .Action}}<form method="post" action="{{.Base}}{{.Action}}"><button type="submit">{{.Button}}</button></form>{{end}}
</main>
</body>
</html>
